<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Informes operativos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: archivo de informes diarios, el más reciente destacado arriba y el histórico en lista. */
:root{--bg:#f3f5f7;--surface:#fff;--line:#dde2e8;--fg:#18212b;--muted:#5d6b7a;--accent:#b86e00;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171d;--surface:#1a2129;--line:#2c3642;--fg:#e6ebf0;--muted:#94a2b2;--accent:#f0b429;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--surface:#1a2129;--line:#2c3642;--fg:#e6ebf0;--muted:#94a2b2;--accent:#f0b429;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:34px;margin:0;line-height:1;border-bottom:3px solid var(--accent);padding-bottom:10px}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card h2{font-family:var(--display);font-size:22px;margin:0}
.meta{font-size:13px;color:var(--muted);font-family:var(--mono)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
a.btn,button.btn{display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:7px 14px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1300;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);text-align:center;padding:24px}
</style>
<div class="wrap">
  <div><h1>Informes operativos</h1><div class="sub">El PDF de cada noche, generado a partir del tablero Seguimiento operativo.</div></div>
  <div class="list" id="list"><div class="empty">Cargando informes…</div></div>
  <div class="sub"><a href="https://claude.ai/artifact/2CAtKaYprADDM2QsYchJZ3" style="color:var(--accent)">Abrir el tablero de seguimiento</a></div>
</div>
<script>
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function fmt(f){const d=new Date(f+"T12:00:00");return DIAS[d.getDay()].replace(/^./,c=>c.toUpperCase())+" "+d.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})}
function el(t,a,...k){const n=document.createElement(t);for(const x in a||{}){if(x==="class")n.className=a[x];else if(x.startsWith("on"))n.addEventListener(x.slice(2),a[x]);else n.setAttribute(x,a[x])}n.append(...k);return n}
let dl=null;(async()=>{try{dl=await window.claude?.use?.("downloads")}catch(e){}render()})();
let data=null;
fetch("informes.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{data=j.informes||[];render()}).catch(()=>{document.getElementById("list").replaceChildren(el("div",{class:"empty"},"No he podido cargar la lista de informes."))});
async function bajar(i){try{const b=await (await fetch(i.archivo)).arrayBuffer();await dl.save({filename:"informe_operativo_"+i.fecha.replaceAll("-","")+".pdf",data:new Uint8Array(b)})}catch(e){}}
function render(){
  if(!data)return;
  const L=document.getElementById("list");
  if(!data.length){L.replaceChildren(el("div",{class:"empty"},"Todavía no hay informes."));return}
  const sel=(location.hash||"").replace("#d","");
  const arr=[...data].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  L.replaceChildren(...arr.map((i,k)=>{
    const hl=sel?sel===i.fecha.replaceAll("-",""):k===0;
    const btns=el("div",{class:"btns"},el("a",{class:"btn primary",href:i.archivo,target:"_blank",rel:"noopener"},"Abrir PDF"));
    if(dl)btns.append(el("button",{class:"btn",type:"button",onclick:()=>bajar(i)},"Descargar"));
    return el("div",{class:"card"+(hl?" hl":""),id:"d"+i.fecha.replaceAll("-","")},el("div",{},el("h2",{},fmt(i.fecha)),el("div",{class:"meta"},`${i.urgentes} urgentes · ${i.paginas} páginas`)),btns);
  }));
}
addEventListener("hashchange",render);
</script>

</body></html>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Certificaciones Hospital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: oficina de obra. Cabecera con el logo, cifras a origen, pestañas por certificación, ficha + resumen, y la relación valorada como hoja de medición. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:#F7F7FB; --ink:#17162C; --muted:#5D5B78; --line:#DDDCE9; --line-strong:#C3C1D6;
  --accent:#340AEA; --accent-ink:#FFFFFF; --accent-soft:#ECE8FE; --input:#FFFFFF;
  --ok:#17744A; --ok-soft:#E3F4EB; --warn:#A44D06; --warn-soft:#FDF0E2; --bad:#B42318; --bad-soft:#FDE9E7;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0E1B; --surface:#191830; --sunk:#141327; --ink:#ECEBF7; --muted:#A4A2C0; --line:#2C2A48; --line-strong:#3E3B60;
  --accent:#A08CFF; --accent-ink:#120F2A; --accent-soft:#251F52; --input:#100F20;
  --ok:#5FCB97; --ok-soft:#173326; --warn:#F2A55B; --warn-soft:#3A2614; --bad:#F2806F; --bad-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E1B; --surface:#191830; --sunk:#141327; --ink:#ECEBF7; --muted:#A4A2C0; --line:#2C2A48; --line-strong:#3E3B60;
  --accent:#A08CFF; --accent-ink:#120F2A; --accent-soft:#251F52; --input:#100F20;
  --ok:#5FCB97; --ok-soft:#173326; --warn:#F2A55B; --warn-soft:#3A2614; --bad:#F2806F; --bad-soft:#3D1A17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
#app{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* cabecera */
.mast{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;justify-content:space-between}
.mast-l{display:flex;align-items:center;gap:18px;min-width:0;flex-wrap:wrap}
.logo-chip{background:#FFFFFF;border-radius:8px;padding:10px 14px;display:flex;align-items:center;border:1px solid var(--line)}
.logo-chip img{height:30px;width:auto;display:block;max-width:220px;object-fit:contain}
.mast h1{font-size:30px;line-height:1.05}
.mast p{margin:2px 0 0;color:var(--muted);font-size:13px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.busy::before{background:var(--warn)}
.status.err::before,.status.local::before{background:var(--bad)}

/* cifras */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* pestañas */
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.tab{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:132px}
.tab strong{font-family:var(--f-display);font-size:17px;font-weight:600}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tab-new{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;vertical-align:middle}
.pill.borrador{background:var(--warn-soft);color:var(--warn)}
.pill.emitida,.pill.cerrada{background:var(--ok-soft);color:var(--ok)}
.btn.close.armed{background:var(--ok);border-color:var(--ok);color:var(--surface)}

/* exportar */
.export{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.export .tb-label{font-weight:600;color:var(--ink);font-size:13px}
.export .hint{font-size:12px;color:var(--muted);flex:1 1 220px}
@media (max-width:760px){.export .seg{flex:1 1 100%}.export .seg button{flex:1}.export .btn{flex:1 1 auto}}

/* lotes */
.lotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lote{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.lote strong{font-family:var(--f-display);font-size:20px;font-weight:600}
.lote span{font-size:12.5px;color:var(--ink)}
.lote span.muted{color:var(--muted)}
.lote[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.lote:hover{border-color:var(--accent)}

/* ficha */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.sheet-head{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;border-bottom:1px solid var(--line)}
@media (max-width:900px){.sheet-head{grid-template-columns:minmax(0,1fr)}}
.fields{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fields h2{font-size:26px}
.frow{display:flex;flex-wrap:wrap;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line-strong);background:var(--input);border-radius:6px;padding:7px 9px;min-width:0}
.f textarea{font:inherit;color:inherit;resize:vertical;min-height:38px}
.f.grow{flex:1 1 220px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.ledger{padding:18px;background:var(--sunk);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
@media (max-width:900px){.ledger{border-left:0;border-top:1px solid var(--line)}}
.ledger h3{font-size:18px;margin-bottom:6px}
.lrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lrow span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow.sub{color:var(--muted)}
.lrow.strong{font-weight:600;border-bottom:1px solid var(--line-strong)}
.lrow.total{border:0;padding-top:10px;font-family:var(--f-display);font-size:22px;font-weight:600}
.lrow.total span:last-child{font-family:var(--f-display)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

/* barra de herramientas */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.apply{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pct-in{width:68px;border:1px solid var(--line-strong);background:var(--input);border-radius:6px;padding:6px 8px;text-align:right;font-family:var(--f-num)}
.tb-label{font-size:12px;color:var(--muted);font-weight:500}

/* relación valorada */
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:1180px;font-size:13px}
.grid th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line-strong);background:var(--surface);position:sticky;top:0;vertical-align:bottom}
.grid th.n{text-align:right;font-family:var(--f-body)}
.grid th.grp{text-align:center;border-bottom:1px solid var(--line);padding-bottom:4px}
.grid td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid td.n{text-align:right;white-space:nowrap}
.grid td.d{min-width:240px;max-width:340px}
.grid td.id{font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.grid .edit{background:var(--accent-soft)}
.grid input.cell{width:84px;border:1px solid var(--line-strong);background:var(--input);border-radius:5px;padding:4px 6px;text-align:right;font-family:var(--f-num);font-size:13px}
.grid input.cell:disabled{border-color:transparent;background:transparent;color:var(--ink)}
.grid tr.cap td{background:var(--sunk);padding:10px 8px;border-bottom:1px solid var(--line-strong)}
.cap-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.cap-wrap h3{font-size:18px}
.grid tr.subt td{font-weight:600;border-bottom:2px solid var(--line-strong)}
.grid tr.over td.flag,.grid tr.over input.cell{color:var(--bad)}
.grid tr.over td.d::after{content:"Supera la medición del presupuesto";display:block;font-size:11px;color:var(--bad)}
.grid tr.neg td.neg{color:var(--warn)}
.grid tfoot td{font-weight:600;font-size:14px;padding:10px 8px}
.m-id,.m-ud{display:none}
.doc .tw{overflow-x:auto}
.muted{color:var(--muted)}

/* documento */
.docwrap{padding:18px;background:var(--sunk);overflow-x:auto}
.doc{background:#FFFFFF;color:#1B1A2E;max-width:1060px;min-width:760px;margin:0 auto;padding:36px 40px;border:1px solid var(--line);box-shadow:0 2px 14px rgba(20,16,60,.08);font-size:12px}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:2px solid #340AEA;padding-bottom:14px;margin-bottom:16px}
.doc .dh img{height:40px;width:auto;max-width:280px;object-fit:contain}
.doc .dh .t{text-align:right}
.doc .dh .t h2{font-family:var(--f-display);font-size:26px;color:#1B1A2E}
.doc .dh .t p{margin:2px 0 0;color:#55536E}
.doc h4{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 6px;color:#340AEA}
.doc table{border-collapse:collapse;width:100%}
.doc td,.doc th{border:1px solid #D4D3E2;padding:4px 6px;text-align:left;vertical-align:top}
.doc th{background:#F0EEFB;font-weight:600;font-size:11px}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.doc .kv td:first-child{width:200px;background:#F7F7FB;font-weight:600}
.doc tr.st td{font-weight:600;background:#F7F7FB}
.doc tr.tt td{font-weight:700;background:#ECE8FE;font-size:13px}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px}
.doc .sig div{border:1px solid #D4D3E2;padding:10px 12px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.doc .obs{color:#55536E;margin:8px 0 0}

/* ajustes */
details.settings{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.settings summary{padding:14px 18px;cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600}
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:0 18px 18px}
@media (max-width:820px){.set-grid{grid-template-columns:minmax(0,1fr)}}
.set-box{display:flex;flex-direction:column;gap:12px;min-width:0}
.logo-prev{background:#FFFFFF;border:1px dashed var(--line-strong);border-radius:8px;padding:14px;display:flex;align-items:center;justify-content:center;min-height:80px}
.logo-prev img{max-height:56px;max-width:100%;object-fit:contain}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{font-size:24px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
/* móvil: cada partida es una ficha */
@media (max-width:760px){
  #app{gap:14px;padding-block:14px 40px}
  .mast h1{font-size:25px}
  .logo-chip{padding:8px 10px}.logo-chip img{height:22px}
  .kpi{padding:12px}.kpi b{font-size:20px}
  .tab{min-width:0;flex:1 1 140px}
  .tab-new{flex:1 1 100%}.tab-new .btn{flex:1 1 auto}
  .fields,.ledger{padding:14px}
  .fields h2{font-size:23px}
  .frow .f{flex:1 1 140px}
  .actions .btn,.actions .seg{flex:1 1 auto}
  .actions .seg button{flex:1}
  .toolbar{padding:12px 14px}
  .toolbar .seg{flex:1 1 100%}.toolbar .seg button{flex:1}
  .apply{flex:1 1 100%}.apply label{flex:1}
  .scroll{overflow-x:visible}
  table.grid{min-width:0;font-size:14px}
  .grid thead{display:none}
  .grid,.grid tbody,.grid tfoot{display:block}
  .grid tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .grid td{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:0;border:0;min-width:0}
  .grid td.n{text-align:left;white-space:normal}
  .grid td[data-l]::before{content:attr(data-l);font-family:var(--f-body);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .grid td.id,.grid td.ud,.grid td.sp{display:none}
  .grid td.d,.grid td.lbl,.grid td.ant{grid-column:1/-1;max-width:none;min-width:0}
  .grid td.d{display:block;font-weight:500}
  .m-id{display:inline;font-family:var(--f-num);color:var(--muted);margin-right:8px;font-weight:400}
  .m-ud{display:inline;color:var(--muted);font-weight:400}
  .grid td.edit{background:var(--accent-soft);border-radius:8px;padding:6px 8px}
  .grid input.cell{width:100%;font-size:16px;padding:7px 8px}
  .grid tr.over td.d::after{margin-top:2px}
  .grid tr.cap{display:block;padding:0}
  .grid tr.cap td{display:block;padding:12px 14px}
  .cap-wrap{flex-direction:column;align-items:stretch}
  .cap-wrap h3{font-size:19px}
  .grid tr.subt,.grid tfoot tr{background:var(--sunk);border-bottom:2px solid var(--line-strong)}
  .grid tr.subt td,.grid tfoot td{border:0;padding:0}
  .docwrap{padding:10px}
  .doc{min-width:0;padding:16px 14px;font-size:11px}
  .doc .dh{flex-wrap:wrap}.doc .dh img{height:30px}.doc .dh .t{text-align:left}.doc .dh .t h2{font-size:22px}
  .doc .kv td:first-child{width:auto}
  .doc .tw table{min-width:640px}
  .doc .sig{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn,.tab{transition:border-color .15s,background .15s}}
</style>

<div id="app"><div class="empty"><h2>Cargando certificaciones…</h2><p class="muted">Leyendo las certificaciones guardadas del hospital.</p></div></div>
<div class="toast" id="toast" hidden></div>

function qf(v){if(v==null||!isFinite(v))return "—";if(Math.abs(v)<0.00005)v=0;let s=Math.abs(v).toFixed(2).replace(/0+$/,"").replace(/\.$/,"");const [i,d]=s.split(".");return (v<0?"−":"")+grp(i)+(d?","+d:"")}
function pf(v){if(!isFinite(v))return "—";if(Math.abs(v)<0.005)v=0;return (Math.round(v*100)/100).toFixed(2).replace(/\.?0+$/,"").replace(".",",")}
function parseNum(s){s=String(s??"").trim().replace(/\s/g,"").replace("−","-");if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const v=parseFloat(s);return isFinite(v)?v:NaN}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fechaES(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return d&&m&&y?`${d}/${m}/${y}`:iso}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- estado ---------- */
let certs=[], cfg={igic:7,isp:false,ret:0,logo:"",obra:{}}, selId=null, view="medir", modo="origen";
let db=null, dl=null, localMode=false, loaded=false;
const dirty=new Set(), writing={}, again={}, timers={};
let cfgTimer=null;

const loteCerts=id=>certs.filter(c=>(c.lote||"")===id);
const sorted=()=>loteCerts(loteId).slice().sort((a,b)=>a.num-b.num);
const sel=()=>certs.find(c=>c.id===selId)||null;
const logoSrc=()=>cfg.logo||DEFAULT_LOGO;
function syncObra(){OBRA={...OBRA_DEF,...(cfg.obra||{})}}
function prevObra(c){return sorted().filter(x=>x.tipo==="obra"&&x.num<c.num).pop()||null}
function qO(c,p){return c&&c.qty&&c.qty[p.k]!=null?+c.qty[p.k]:0}
function anticipoImporte(c){return r2(P.reduce((s,p)=>s+r2(p.q*(+c.pct||0)/100*p.p),0))}
function antHasta(num){return r2(sorted().filter(x=>x.tipo==="anticipo"&&x.num<=num).reduce((s,x)=>s+anticipoImporte(x),0))}
function fiscal(base){const igic=cfg.isp?0:r2(base*(+cfg.igic||0)/100);return {igic,total:r2(base+igic)}}

function calc(c){
  if(c.tipo==="anticipo"){
    const rows=P.map(p=>{const qo=p.q*(+c.pct||0)/100;const io=r2(qo*p.p);return {p,qa:0,qo,qt:qo,ia:0,io,it:io}});
    const caps=capTotals(rows);const base=anticipoImporte(c);
    return {tipo:"anticipo",rows,caps,O:base,A:0,T:base,base,...fiscal(base)};
  }
  const prev=prevObra(c);
  const nd=!prev&&!!PREV;
  const rows=P.map(p=>{const qa=nd?NaN:qO(prev,p),qo=qO(c,p);const ia=nd?NaN:r2(qa*p.p),io=r2(qo*p.p);return {p,qa,qo,qt:qo-qa,ia,io,it:nd?NaN:r2(io-ia)}});
  const caps=capTotals(rows);
  const O=r2(rows.reduce((s,r)=>s+r.io,0)),A=nd?PREV.importe:r2(rows.reduce((s,r)=>s+r.ia,0)),T=r2(O-A);
  const ant=antHasta(c.num),rate=PEM?ant/PEM:0;
  const amortO=Math.min(ant,Math.max(0,r2(O*rate)));
  const amortPrev=prev?calc(prev).amortO:0;
  const amort=r2(amortO-amortPrev);
  const ret=r2(T*(+cfg.ret||0)/100);
  const base=r2(T-amort-ret);
  return {tipo:"obra",nd,rows,caps,O,A,T,ant,rate,amortO,amort,ret,base,pend:r2(ant-amortO),...fiscal(base)};
}
function capTotals(rows){const o={};for(const c of CAPS){const rs=rows.filter(r=>r.p.cap===c.id);o[c.id]={O:r2(rs.reduce((s,r)=>s+r.io,0)),A:r2(rs.reduce((s,r)=>s+r.ia,0)),T:r2(rs.reduce((s,r)=>s+r.it,0))}}return o}
function loteStats(L){
  const prevL=loteId;setLote(L.id);
  const last=sorted().filter(x=>x.tipo==="obra").pop();
  const ejec=last?calc(last).O:0;const n=sorted().length;const pem=PEM;
  setLote(prevL);return {ejec,pem,n};
}
function stats(c){
  const lastObra=c.tipo==="obra"?c:prevObra(c);
  const k=lastObra?calc(lastObra):null;
  const ejec=k?k.O:0;
  const ant=antHasta(c.num);
  const liq=r2((PREV?PREV.importe:0)+sorted().filter(x=>x.num<=c.num).reduce((s,x)=>s+calc(x).base,0));
  return {ejec,pct:ejec/PEM*100,ant,pend:r2(ant-(k?k.amortO:0)),liq};
}
function tituloCert(c){return c.tipo==="anticipo"?`Anticipo al inicio de obra · ${pf(+c.pct||0)} %`:(c.periodo?`Obra ejecutada · ${c.periodo}`:"Obra ejecutada")}

/* ---------- guardado ---------- */
function strip(c){const o={...c};delete o.id;return JSON.parse(JSON.stringify(o))}
function setStatus(t,cls=""){const el=document.getElementById("status");if(el){el.textContent=t;el.className="status "+cls}}
function scheduleSave(c){dirty.add(c.id);setStatus("Guardando…","busy");clearTimeout(timers[c.id]);timers[c.id]=setTimeout(()=>flush(c.id),700)}
async function flush(id){
  if(writing[id]){again[id]=true;return}
  writing[id]=true;
  const c=certs.find(x=>x.id===id);
  try{ if(c&&db) await db.doc("certs/"+id).set(strip(c)); setStatus(localMode?"Sin guardar (vista local)":"Guardado",localMode?"local":""); }
  catch(e){ setStatus("No se ha podido guardar. Revisa la conexión y vuelve a editar.","err"); }
  writing[id]=false;
  if(again[id]){again[id]=false;flush(id)}else dirty.delete(id);
}
function saveCfg(){clearTimeout(cfgTimer);setStatus("Guardando…","busy");cfgTimer=setTimeout(async()=>{try{if(db)await db.doc("config/obra").set(JSON.parse(JSON.stringify(cfg)));setStatus(localMode?"Sin guardar (vista local)":"Guardado",localMode?"local":"")}catch(e){setStatus("No se han podido guardar los ajustes.","err")}cfgTimer=null},500)}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2800)}

    h+=`<section class="empty"><h2>${esc(loteTag())}: falta el presupuesto</h2><p class="muted">Este lote aparecerá en cuanto se cargue su presupuesto aceptado (partidas con unidad, precio y medición). Las certificaciones de los otros lotes no se ven afectadas.</p></section>`;
    h+=settingsHTML();const os=document.querySelector("details.settings")?.open;app.innerHTML=h;if(os)document.querySelector("details.settings").open=true;return;

    <div class="tab-new"><button class="btn primary" data-act="new-obra">+ Nueva certificación de obra</button><button class="btn ghost" data-act="new-ant">+ Anticipo</button></div></nav>`;
  if(c)h+=exportBarHTML(c);
  if(!c){
    h+=`<section class="empty"><h2>Aún no hay certificaciones</h2><p class="muted">Crea la primera. Una certificación de obra recoge lo medido a origen; un anticipo certifica un % del presupuesto que se descuenta después.</p><div class="actions"><button class="btn primary" data-act="new-obra">Crear certificación de obra</button><button class="btn" data-act="new-ant">Crear anticipo</button></div></section>`;
  } else {

  }

}
function lotesHTML(){
  return `<nav class="lotes" aria-label="Lotes">${LOTES.map(L=>{
    if(!L.P.length)return `<button class="lote" data-act="lote" data-id="${L.id}" aria-selected="${L.id===loteId}"><strong>${esc(L.nombre)}</strong><span>${esc(L.desc||"Presupuesto pendiente")}</span><span class="muted">Sin presupuesto cargado</span></button>`;
    const s=loteStats(L);const pct=s.pem?s.ejec/s.pem*100:0;
    return `<button class="lote" data-act="lote" data-id="${L.id}" aria-selected="${L.id===loteId}"><strong>${esc(L.nombre)}</strong><span>${esc(L.desc)}</span><span class="num">${eur(s.ejec)} € de ${eur(s.pem)} € · ${pf(pct)} %</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div><span class="muted">${s.n} certificaci${s.n===1?"ón":"ones"}</span></button>`}).join("")}</nav>`;
}
function kpisHTML(c){

   <div class="kpi"><span class="eyebrow">Pendiente de ejecutar</span><b>${eur(r2(PEM-s.ejec))} €</b><small>de ${eur(PEM)} €</small></div>
   <div class="kpi"><span class="eyebrow">Anticipo por amortizar</span><b>${eur(s.pend)} €</b><small>de ${eur(s.ant)} € anticipados</small></div>
   <div class="kpi"><span class="eyebrow">Certificado a origen (base)</span><b>${eur(s.liq)} €</b><small>suma de las certificaciones hasta la nº ${c.num}, sin IGIC</small></div>

function sheetHTML(c){
  const k=calc(c), locked=c.estado!=="borrador", last=sorted().pop()?.id===c.id;
  let h=`<section class="sheet"><div class="sheet-head"><div class="fields">
    <div><div class="eyebrow">${c.tipo==="anticipo"?"Anticipo":"Certificación de obra"}</div><h2>Certificación nº ${c.num}</h2></div>

      :`<div class="f"><label for="f-pct">% del presupuesto</label><input id="f-pct" class="pct-in" type="text" inputmode="decimal" value="${pf(+c.pct||0)}" ${locked?"disabled":""} data-field="pct"></div>`}

      <button class="btn" data-act="xlsx">Excel</button>
      ${locked?`<button class="btn" data-act="estado" data-v="borrador">Reabrir para editar</button>`:`<button class="btn primary" data-act="guardar">Guardar cambios</button><button class="btn close" data-act="cerrar">Cerrar certificación</button>`}
      ${last?`<button class="btn danger" data-act="del">Eliminar</button>`:""}
    </div>
    ${locked?`<p class="note">${last?"Cerrada: las mediciones e importes quedan bloqueados. Pulsa «Reabrir para editar» si necesitas corregirla.":"Cerrada. Si la reabres y cambias mediciones, las certificaciones posteriores se recalculan solas (su «anterior» parte de esta)."}</p>`:""}

  else h+= c.tipo==="obra"?obraTableHTML(c,k,locked):antTableHTML(c,k);
  return h+`</div></section>`;
}
function ledgerHTML(c,k){
  const ig=cfg.isp?`<div class="lrow sub"><span>IGIC: inversión del sujeto pasivo</span><span>0,00</span></div>`:`<div class="lrow"><span>IGIC ${pf(+cfg.igic)} %</span><span>${eur(k.igic)}</span></div>`;

    <div class="lrow strong"><span>Base imponible</span><span>${eur(k.base)}</span></div>${ig}
    <div class="lrow total"><span>Total nº ${c.num}</span><span>${eur(k.total)} €</span></div>
    ${k.ant>0?`<p class="note">Anticipo pendiente de amortizar tras esta certificación: ${eur(k.pend)} €.</p>`:""}`;

function antTableHTML(c,k){
  let h=`<div class="toolbar"><span class="tb-label">Base de cálculo: el ${pf(+c.pct||0)} % de la medición de cada partida del presupuesto aceptado.</span></div><div class="scroll"><table class="grid"><thead><tr><th>Nº</th><th>Descripción</th><th>Ud</th><th class="n">Precio €</th><th class="n">Presup.</th><th class="n">Med. cert.</th><th class="n">Importe €</th></tr></thead><tbody>`;
  for(const cap of CAPS){
    h+=`<tr class="cap"><td colspan="7"><h3>Capítulo ${cap.id} · ${esc(cap.nombre)}</h3></td></tr>`;

    h+=`<tr class="subt"><td colspan="6" class="lbl">Total capítulo ${cap.id}</td><td class="n">${eur(k.caps[cap.id].O)}</td></tr>`;

/* ---------- documento ---------- */
function docModel(c,k){
  const datos=[["Obra",OBRA.titulo],["Lote",loteTag()]];
  if(OBRA.emplazamiento)datos.push(["Emplazamiento",OBRA.emplazamiento]);
  if(OBRA.promotor)datos.push(["Promotor",OBRA.promotor]);
  if(OBRA.contratista)datos.push(["Contratista",OBRA.contratista]);
  datos.push(["Empresa que certifica",OBRA.certifica],["Presupuesto del lote (sin IGIC)",eu(PEM)]);
  if(c.tipo==="obra"&&c.periodo)datos.push(["Periodo",c.periodo]);
  datos.push(["Fecha",c.fecha?fechaES(c.fecha):"[pendiente]"]);
  const resumen=[];
  if(c.tipo==="anticipo"){
    for(const cap of CAPS)resumen.push([`Capítulo ${cap.id} · ${cap.nombre}`,eu(k.caps[cap.id].O),""]);
    resumen.push([`Importe certificado (${pf(+c.pct||0)} % de ${eu(PEM)})`,eu(k.base),"st"]);
  } else {
    resumen.push(["Obra ejecutada a origen",eu(k.O),""],[`Obra certificada anteriormente${k.nd?` (certificaciones ${prevLabel()})`:""}`,eu(-k.A),""],["Obra ejecutada en esta certificación",eu(k.T),"st"]);
    if(k.ant>0)resumen.push([`Amortización del anticipo (${pf(k.rate*100)} % de la obra de esta certificación)`,eu(-k.amort),""]);
    if(+cfg.ret>0)resumen.push([`Retención de garantía ${pf(+cfg.ret)} %`,eu(-k.ret),""]);
    resumen.push(["Base imponible",eu(k.base),"st"]);
  }
  resumen.push(cfg.isp?["IGIC: operación con inversión del sujeto pasivo","0,00",""]:[`IGIC ${pf(+cfg.igic)} %`,eu(k.igic),""]);
  resumen.push([`TOTAL CERTIFICACIÓN Nº ${c.num}`,eu(k.total),"tt"]);
  let obs=[];
  if(c.tipo==="anticipo")obs.push(`A cuenta del presupuesto aceptado. Este anticipo se descontará de las certificaciones siguientes según lo pactado${OBRA.contratista?" con "+OBRA.contratista:""}.`);
  if(c.tipo==="obra"&&k.ant>0)obs.push(`Anticipo pendiente de amortizar tras esta certificación: ${eu(k.pend)} €.`);
  if(c.notas)obs.push(c.notas);
  return {datos,resumen,obs,titulo:tituloCert(c)};
}

function refreshNumbers(){
  const c=sel();if(!c)return;const k=calc(c);
  const ae=document.activeElement;
  for(const r of k.rows){
    const tr=document.getElementById("r-"+r.p.k);if(!tr)continue;
    const vals={qa:qf(r.qa),qo:qf(r.qo),po:pf(r.qo/r.p.q*100),qt:qf(r.qt),pt:pf(r.qt/r.p.q*100),it:eur(r.it),io:eur(r.io)};
    tr.querySelectorAll("[data-c]").forEach(el=>el.textContent=vals[el.dataset.c]);
    tr.querySelectorAll("input[data-in]").forEach(el=>{if(el!==ae)el.value=vals[el.dataset.in]});
    tr.classList.toggle("over",r.qo>r.p.q+1e-6);
    tr.classList.toggle("neg",r.qt<-1e-6);
  }
  for(const cap of CAPS){const s=document.getElementById("s-"+cap.id);if(!s)continue;const t=k.caps[cap.id];
    s.querySelector('[data-c="cpo"]').textContent=pf(t.O/CAP_PEM[cap.id]*100)+" %";s.querySelector('[data-c="cpt"]').textContent=pf(t.T/CAP_PEM[cap.id]*100)+" %";s.querySelector('[data-c="ct"]').textContent=eur(t.T);s.querySelector('[data-c="co"]').textContent=eur(t.O)}
  const a=document.getElementById("s-all");if(a){a.querySelector('[data-c="cpo"]').textContent=pf(k.O/PEM*100)+" %";a.querySelector('[data-c="cpt"]').textContent=pf(k.T/PEM*100)+" %";a.querySelector('[data-c="ct"]').textContent=eur(k.T);a.querySelector('[data-c="co"]').textContent=eur(k.O)}
  const l=document.getElementById("ledger");if(l)l.innerHTML=ledgerHTML(c,k);
  if(view==="doc"){const ba=document.getElementById("body-area");if(ba)ba.innerHTML=`<div class="docwrap">${docHTML(c,k)}</div>`}
  const kp=document.getElementById("kpis");if(kp)kp.outerHTML=kpisHTML(c);
  document.querySelectorAll(".tab").forEach(t=>{const x=certs.find(y=>y.id===t.dataset.id);if(x)t.querySelector(".tab-sub").textContent=`${x.tipo==="anticipo"?`Anticipo ${pf(+x.pct||0)} %`:(x.periodo||"Obra ejecutada")} · ${eur(calc(x).total)} €`});
}

    const prev=prevObra(c);const q={...(c.qty||{})};

    c.qty=q;scheduleSave(c);render();toast(`${b.dataset.cap?"Capítulo "+b.dataset.cap:"Toda la obra"}: ${modo==="origen"?"a origen al":"sumado"} ${pf(v)} %`);return;
  }
  if(act==="copyprev"){const prev=prevObra(c);const q={};for(const p of P)q[p.k]=qO(prev,p);c.qty=q;scheduleSave(c);render();return}
  if(act==="cerrar"){
    if(closeArmed!==c.id){closeArmed=c.id;b.classList.add("armed");b.textContent="Pulsa otra vez para cerrar";setTimeout(()=>{if(closeArmed===c.id){closeArmed=null;b.classList.remove("armed");b.textContent="Cerrar certificación"}},4000);return}
    closeArmed=null;c.estado="cerrada";c.cerrada=new Date().toISOString();if(!c.fecha)c.fecha=todayISO();scheduleSave(c);render();toast(`Certificación nº ${c.num} cerrada`);return;
  }
  if(act==="estado"){c.estado=b.dataset.v;scheduleSave(c);render();toast(`Certificación nº ${c.num} reabierta`);return}
  if(act==="del"){
    if(delArmed!==c.id){delArmed=c.id;b.classList.add("armed");b.textContent="Pulsa otra vez para eliminar";setTimeout(()=>{if(delArmed===c.id){delArmed=null;b.classList.remove("armed");b.textContent="Eliminar"}},4000);return}
    delArmed=null;deleteCert(c);return;

  if(act==="cols"){certCols=b.dataset.v;try{localStorage.setItem("hosp-cols",certCols)}catch(e){}render();return}

  if(act==="exp-scope"){expScope=b.dataset.v;render();return}
  if(act==="exp"){exportLote(b.dataset.v,c);return}
});

async function newCert(tipo){
  const num=(sorted().pop()?.num||PREV?.hasta||0)+1;
  const id="l"+loteId+"-c"+String(num).padStart(2,"0");
  const c={id,lote:loteId,num,tipo,fecha:todayISO(),periodo:"",estado:"borrador",notas:"",creada:new Date().toISOString()};
  if(tipo==="anticipo")c.pct=10;
  else{const prev=sorted().filter(x=>x.tipo==="obra").pop();const q={};for(const p of P)q[p.k]=qO(prev,p);c.qty=q;}
  certs.push(c);selId=id;view="medir";render();scheduleSave(c);
  toast(tipo==="anticipo"?`Anticipo nº ${num} creado al 10 %`:`Certificación nº ${num} creada. Mide a origen o aplica un %.`);
}
async function deleteCert(c){
  certs=certs.filter(x=>x.id!==c.id);clearTimeout(timers[c.id]);dirty.delete(c.id);
  selId=sorted().pop()?.id||null;render();
  try{if(db)await db.doc("certs/"+c.id).delete();toast(`Certificación nº ${c.num} eliminada`)}catch(e){toast("No se ha podido eliminar en el servidor")}
}

/* ---------- logo ---------- */
function shrinkImage(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const w=Math.min(800,img.naturalWidth||800),h=Math.round((img.naturalHeight||200)*w/(img.naturalWidth||800));
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.fillStyle="#FFFFFF";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    let out=cv.toDataURL("image/png");if(out.length>180000)out=cv.toDataURL("image/jpeg",0.9);res(out)};img.src=fr.result};fr.readAsDataURL(file)});
}
function imgSize(src){return new Promise(res=>{const i=new Image();i.onload=()=>res([i.naturalWidth,i.naturalHeight]);i.onerror=()=>res([4,1]);i.src=src})}

const pdfTxt=s=>String(s).replace(/−/g,"-").replace(/–/g,"-").replace(/·/g,"·");
async function saveFile(filename,data){

async function makePdf(c){
  if(!window.jspdf||!window.jspdf.jsPDF){toast("No se ha cargado el generador de PDF. Recarga la página.");return}

  const src=logoSrc();
  if(src){const [iw,ih]=await imgSize(src);const lh=11,lw=Math.min(62,lh*iw/ih);try{doc.addImage(src,src.startsWith("data:image/jpeg")?"JPEG":"PNG",M,10,lw,lw*ih/iw)}catch(e){}}
  else{doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(27,26,46);doc.text(pdfTxt(OBRA.certifica),M,17)}
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(27,26,46);doc.text(`CERTIFICACIÓN Nº ${c.num}`,W-M,16,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(85,83,110);doc.text(pdfTxt(loteTag()+" · "+m.titulo),W-M,22,{align:"right"});
  doc.setDrawColor(...ACC);doc.setLineWidth(0.6);doc.line(M,26,W-M,26);
  const head={fillColor:[240,238,251],textColor:[27,26,46],fontStyle:"bold",fontSize:8};
  const base={font:"helvetica",fontSize:8,cellPadding:1.4,lineColor:[212,211,226],lineWidth:0.2,textColor:[27,26,46]};
  const sect=(t,y)=>{doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...ACC);doc.text(t,M,y);return y+2};
  let y=sect("DATOS DE LA OBRA",33);
  doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",styles:base,body:m.datos.map(r=>r.map(pdfTxt)),columnStyles:{0:{cellWidth:46,fontStyle:"bold",fillColor:[247,247,251]}}});
  y=sect("RELACIÓN VALORADA",doc.lastAutoTable.finalY+8);
  for(const cap of CAPS){
    const rs=k.rows.filter(r=>r.p.cap===cap.id);

function origenModel(c){
  const upto=sorted().filter(x=>x.num<=c.num);
  const last=upto.filter(x=>x.tipo==="obra").pop();
  const k=last?calc(last):null;
  const rows=P.map(p=>{const qo=k?k.rows.find(r=>r.p.k===p.k).qo:0;const ip=r2(p.p*p.q),io=r2(qo*p.p);return {p,ip,qo,io,pend:r2(ip-io)}});
  const caps=CAPS.map(cp=>{const rs=rows.filter(r=>r.p.cap===cp.id);return {cap:cp,ip:CAP_PEM[cp.id],io:r2(rs.reduce((s,r)=>s+r.io,0))}});
  const O=r2(rows.reduce((s,r)=>s+r.io,0));
  const ks=upto.map(x=>calc(x));
  const pv=prevFiscal()||{base:0,igic:0,total:0};
  const base=r2(pv.base+ks.reduce((s,x)=>s+x.base,0)),igic=r2(pv.igic+ks.reduce((s,x)=>s+x.igic,0)),total=r2(pv.total+ks.reduce((s,x)=>s+x.total,0));
  const ant=antHasta(c.num),amort=k?k.amortO:0,ret=r2(ks.reduce((s,x)=>s+(x.ret||0),0));
  return {upto,rows,caps,O,base,igic,total,ant,amort,ret,hasta:c.num};
}
function detalleModel(){
  const all=sorted();const obras=all.filter(x=>x.tipo==="obra");
  const ks=new Map(all.map(x=>[x.id,calc(x)]));
  const rows=P.map(p=>{const per=obras.map(x=>{const r=ks.get(x.id).rows.find(r=>r.p.k===p.k);return {qt:r.qt,it:r.it}});const lastK=obras.length?ks.get(obras[obras.length-1].id).rows.find(r=>r.p.k===p.k):null;return {p,per,qo:lastK?lastK.qo:0,io:lastK?lastK.io:0}});
  return {all,obras,ks,rows};
}

  hr.height=30;ws.views=[{state:"frozen",ySplit:r}];ws.pageSetup.printTitlesRow=`${r}:${r}`;r++;

    row.v.forEach((v,i)=>{const c=R.getCell(i+1),f=s.cols[i].f;c.value=(v===""||(typeof v==="number"&&!isFinite(v)))?null:v;c.border=xlBorder();c.font={size:9.5,bold:row.t!=="item"};
      if(f==="eur")c.numFmt=XL.eur;else if(f==="qty")c.numFmt=XL.qty;
      c.alignment={vertical:"top",wrapText:f==="wrap",horizontal:f==="eur"||f==="qty"?"right":"left"};
      if(row.t==="sub")c.fill=xlFill(XL.sunk);if(row.t==="total")c.fill=xlFill(XL.accSoft)});

    rows:[...rr.map(v=>({t:"item",v})),{t:"total",span:5,v:["Total","","","","",...tot]}]});
}

/* ---------- arranque ---------- */
function applySnapshot(snap){
  const remote=snap.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));
  let changed=remote.length!==certs.length;
  const next=remote.map(r=>{const l=certs.find(x=>x.id===r.id);if(l&&dirty.has(r.id))return l;if(!l||JSON.stringify(strip(l))!==JSON.stringify(strip(r)))changed=true;return r});
  for(const l of certs)if(dirty.has(l.id)&&!next.find(x=>x.id===l.id))next.push(l);
  certs=next;
  if(!loaded){loaded=true;selId=sorted().pop()?.id||null;render();return}
  if(selId&&!sorted().find(x=>x.id===selId))selId=sorted().pop()?.id||null;
  if(!certs.find(x=>x.id===selId))selId=sorted().pop()?.id||null;
  if(changed){const ae=document.activeElement;if(ae&&app.contains(ae)&&ae.matches("input,textarea"))refreshNumbers();else render()}
}
function startLocal(){
  localMode=true;loaded=true;
  certs=[];
  selId=null;render();
}
(async()=>{
  try{dl=await window.claude?.use?.("downloads")}catch(e){dl=null}
  let d=null;try{d=await window.claude?.use?.("db")}catch(e){d=null}
  if(!d){startLocal();return}
  db=d;
  db.doc("config/obra").onSnapshot(s=>{if(s.exists){const v=s.data();const nc={igic:7,isp:false,ret:0,logo:"",obra:{},...JSON.parse(JSON.stringify(v))};if(JSON.stringify(nc)!==JSON.stringify(cfg)&&!cfgTimer){cfg=nc;syncObra();const ae=document.activeElement;if(loaded&&!(ae&&ae.dataset&&ae.dataset.obra))render()}}},()=>{});
  db.collection("certs").onSnapshot(applySnapshot,()=>{setStatus("Se ha perdido la conexión con el guardado. Recarga la página.","err")});
  setTimeout(()=>{if(!loaded){loaded=true;render()}},8000);
})();

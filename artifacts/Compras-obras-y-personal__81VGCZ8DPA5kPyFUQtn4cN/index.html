<style>

  --accent:#5b9be6; --accent-ink:#0d1420; --accent-soft:#1d2c40;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9b72e3; --s5:#d6a817;

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:20}

<script>
(()=>{
const PROVS=['Diexfe','Coelca','Sonepar','Fraper','BAP'];
const SER={Diexfe:'var(--s1)',Coelca:'var(--s2)',Sonepar:'var(--s3)',Fraper:'var(--s4)',BAP:'var(--s5)'};
const provColor=p=>SER[p]||'var(--muted)';
const eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2,useGrouping:'always'});
const eur0=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'});
const pfmt=v=>{const d=v<1?4:v<10?3:2;return new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:d}).format(v)+' €'};
const nfmt=new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
const pct=v=>(v>0?'+':'')+new Intl.NumberFormat('es-ES',{maximumFractionDigits:1}).format(v*100)+' %';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{const[y,m,d]=s.split('-');return `${+d} ${MES[m-1]} ${y.slice(2)}`};
const fmes=s=>{const[y,m]=s.split('-');return `${MES[m-1]} ${y.slice(2)}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

let DOCS=[],GROUPS=[],DESC=new Set(),db=null,dbState='loading';
const UI={area:'compras',view:'resumen',sel:null,q:'',provs:new Set(PROVS),sort:'var',emp:'',per:'all',obra:null,oq:'',odesde:'',pmes:'',pop:null,rmes:'',rop:null,pf:{},pedit:null,pdraft:null};
try{const s=JSON.parse(localStorage.getItem('hc-ui')||'{}');if(s.emp!=null)UI.emp=s.emp;if(s.per)UI.per=s.per}catch(e){}
$('#fEmp').value=UI.emp;$('#fPer').value=UI.per;
$('#fEmp').onchange=e=>{UI.emp=e.target.value;saveUI();recompute()};
$('#fPer').onchange=e=>{UI.per=e.target.value;saveUI();recompute()};
function saveUI(){try{localStorage.setItem('hc-ui',JSON.stringify({emp:UI.emp,per:UI.per}))}catch(e){}}

/* ---------- normalización y semejanza ---------- */
const STOP=new Set(['DE','CON','PARA','POR','LA','EL','LOS','LAS','Y','EN','A','SIN','P','C','UD','UDS','MM','M','MTS','ROLLO','BOB','BL','BLANCO','NG','NEGRO','GR','GRIS','AZ','MR','RJ','VD','AM']);
const normTxt=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/(\d),(\d)/g,'$1.$2');
function feats(desc){
  const t=normTxt(desc);
  const nums=new Set((t.match(/\d+(?:\.\d+)?/g)||[]).map(x=>String(+x)));
  const words=new Set((t.replace(/[\d.]+/g,' ').match(/[A-Z]{2,}/g)||[]).filter(w=>!STOP.has(w)));
  return {nums,words};
}
const jac=(a,b)=>{if(!a.size&&!b.size)return 1;let i=0;for(const x of a)if(b.has(x))i++;return i/(a.size+b.size-i)};
function simil(A,B){
  const w=jac(A.words,B.words); if(w===0)return 0;
  let n=1; if(A.nums.size||B.nums.size) n=jac(A.nums,B.nums);
  if((A.nums.size&&B.nums.size)&&n<0.34)return 0;
  return 0.55*w+0.45*n;
}
const normRef=s=>String(s||'').toUpperCase().replace(/\*+/g,'').replace(/[^A-Z0-9]/g,'');

/* ---------- modelo derivado ---------- */
let M=null;
function monthsBack(n){const d=new Date();d.setMonth(d.getMonth()-n);return d.toISOString().slice(0,10)}
function build(){
  const desde=UI.per==='all'?'0000':monthsBack(+UI.per);
  const all=[],tarifas={};
  const facturados=new Set();for(const d of DOCS)if(d.tipo==='factura')for(const l of d.lineas||[])facturados.add(d.proveedor+'|'+nAlb(d.proveedor,l.a));
  for(const doc of DOCS){
    if(UI.emp&&doc.empresa!==UI.emp&&doc.tipo!=='tarifa')continue;
    if(doc.tipo!=='factura'&&doc.tipo!=='albaran'&&doc.tipo!=='tarifa')continue;
    if(doc.tipo==='albaran'&&facturados.has(doc.proveedor+'|'+nAlb(doc.proveedor,doc.numero)))continue;
    for(const l of doc.lineas||[]){
      if(doc.tipo==='tarifa'){tarifas[doc.proveedor+'|'+l.r]={pn:l.pn,pt:l.pt,dto:l.dto,f:l.f,fam:l.fam,d:l.d};continue}
      if(!(l.q>0)||!(l.pn>0))continue;
      all.push({...l,prov:doc.proveedor,emp:doc.empresa,doc:doc.numero,docId:doc.id});
    }
  }
  all.sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
  const prods=new Map();
  for(const l of all){
    const k=l.prov+'|'+l.r;
    let p=prods.get(k); if(!p){p={k,prov:l.prov,ref:l.r,d:l.d,fab:l.fab||'',marca:l.m||'',all:[],c:[]};prods.set(k,p)}
    p.all.push(l); if(l.fab)p.fab=l.fab; if(l.m)p.marca=l.m;
  }
  // productos solo en tarifa (para comparar)
  for(const [k,t] of Object.entries(tarifas)) if(!prods.has(k)){const [prov,ref]=k.split('|');prods.set(k,{k,prov,ref,d:t.d,fab:'',marca:'',all:[],c:[],soloTarifa:true})}
  const lines=all.filter(l=>l.f>=desde);
  for(const p of prods.values()){
    p.c=p.all.filter(l=>l.f>=desde);
    p.tar=tarifas[p.k]||null;
    p.feat=feats(p.d);
    p.fabN=normRef(p.prov==='Diexfe'?p.ref:p.fab);
    const h=p.all; if(h.length){
      p.first=h[0].pn; p.last=h[h.length-1].pn; p.lastF=h[h.length-1].f;
      p.min=Math.min(...h.map(x=>x.pn)); p.max=Math.max(...h.map(x=>x.pn));
      p.var=h.length>1?p.last/p.first-1:null;
    }
    p.gasto=p.c.reduce((s,x)=>s+x.i,0);
    p.sobre=p.c.reduce((s,x)=>s+(x.pn-p.min)*x.q,0);
    // variación dentro del periodo: último del periodo vs último precio anterior al periodo (o primero del periodo)
    if(p.c.length){const prev=p.all.filter(l=>l.f<desde);const base=prev.length?prev[prev.length-1].pn:p.c[0].pn;p.varPer=(p.c.length+(prev.length?1:0))>1?p.c[p.c.length-1].pn/base-1:null}
  }
  M={all,lines,prods,desde,tarifas};
  buildGroups();
}
function lastPrice(p){ // precio de referencia actual: última compra o tarifa más reciente
  const c=p.all.length?{pn:p.last,f:p.lastF,src:'compra'}:null;
  const t=p.tar?{pn:p.tar.pn,f:p.tar.f,src:'tarifa'}:null;
  if(c&&t)return t.f>c.f?t:c; return c||t;
}
function buildGroups(){
  const groups=[];const inG=new Map();
  for(const g of GROUPS){const ms=(g.miembros||[]).filter(k=>M.prods.has(k));if(ms.length<2)continue;const G={id:g.id,nombre:g.nombre,ms,auto:false};groups.push(G);ms.forEach(k=>inG.set(k,G))}
  // automáticos por referencia de fabricante idéntica entre proveedores
  const byRef=new Map();
  for(const p of M.prods.values()){if(!p.fabN||p.fabN.length<4||inG.has(p.k))continue;(byRef.get(p.fabN)||byRef.set(p.fabN,[]).get(p.fabN)).push(p.k)}
  for(const [r,ks] of byRef){const provs=new Set(ks.map(k=>k.split('|')[0]));if(provs.size<2)continue;const G={id:'auto-'+r,nombre:M.prods.get(ks[0]).d,ms:ks,auto:true};groups.push(G);ks.forEach(k=>inG.set(k,G))}
  M.groups=groups;M.inG=inG;
}
function candidatos(p,limit=6){
  const out=[];
  for(const q of M.prods.values()){
    if(q.prov===p.prov)continue;
    const s=simil(p.feat,q.feat); if(s>=0.35)out.push({q,s});
  }
  return out.sort((a,b)=>b.s-a.s).slice(0,limit);
}
let SUG=null;
function sugerencias(){
  if(SUG)return SUG;
  // índice invertido por palabra para limitar pares; solo productos comprados
  const ps=[...M.prods.values()].filter(p=>p.all.length&&!M.inG.has(p.k));
  const idx=new Map();ps.forEach((p,i)=>p.feat.words.forEach(w=>(idx.get(w)||idx.set(w,[]).get(w)).push(i)));
  const seen=new Set(),out=[];
  ps.forEach((p,i)=>{
    const cand=new Set();p.feat.words.forEach(w=>{const l=idx.get(w);if(l&&l.length<120)l.forEach(j=>{if(j>i)cand.add(j)})});
    for(const j of cand){const q=ps[j];if(q.prov===p.prov)continue;const key=[p.k,q.k].sort().join('~');if(seen.has(key)||DESC.has(key))continue;seen.add(key);
      const s=simil(p.feat,q.feat);if(s>=0.5)out.push({a:p,b:q,s,key})}
  });
  return SUG=out.sort((x,y)=>y.s-x.s).slice(0,80);
}

/* ---------- gráficos ---------- */
function tipHandlers(box){
  const tip=document.createElement('div');tip.className='tip';tip.hidden=true;box.appendChild(tip);
  return {show(html,x,y){tip.innerHTML=html;tip.hidden=false;const w=box.clientWidth;tip.style.left=Math.min(Math.max(x,70),w-70)+'px';tip.style.top=y+'px'},hide(){tip.hidden=true}};
}
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function stackedMonthly(box,lines){
  const months=[...new Set(lines.map(l=>l.f.slice(0,7)))].sort();
  if(!months.length){box.innerHTML='<div class="empty">Sin compras en este periodo.</div>';return}
  const data=months.map(m=>{const o={m,t:0};PROVS.forEach(p=>o[p]=0);lines.forEach(l=>{if(l.f.startsWith(m)){o[l.prov]=(o[l.prov]||0)+l.i;o.t+=l.i}});return o});
  const W=Math.max(300,Math.round(box.clientWidth||720)),H=260,L=56,R=8,T=10,B=26,max=niceMax(Math.max(...data.map(d=>d.t)));
  const bw=(W-L-R)/months.length,barW=Math.min(46,bw*0.62),y=v=>T+(H-T-B)*(1-v/max);

function priceIndex(lines){
  // índice de precio: cada compra frente al primer precio pagado por ese artículo (base 100), media mensual ponderada por importe
  const first=new Map();for(const l of M.all){const k=l.prov+'|'+l.r;if(!first.has(k))first.set(k,l.pn)}
  const cnt=new Map();M.all.forEach(l=>{const k=l.prov+'|'+l.r;cnt.set(k,(cnt.get(k)||0)+1)});
  const by=new Map();
  for(const l of lines){const k=l.prov+'|'+l.r;if(cnt.get(k)<2)continue;const m=l.f.slice(0,7);const o=by.get(m)||{w:0,s:0,n:0};o.w+=l.i;o.s+=l.i*(l.pn/first.get(k)*100);o.n++;by.set(m,o)}
  return [...by.entries()].sort().map(([m,o])=>({m,v:o.s/o.w,n:o.n}));
}

function reportData(){
  const L=M.lines,tot=L.reduce((s,l)=>s+l.i,0);

  const obras=new Map();L.forEach(l=>{const o=(l.o||'(sin obra)').trim().toUpperCase();obras.set(o,(obras.get(o)||0)+l.i)});
  const topObras=[...obras.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  const cambios=[...M.prods.values()].filter(p=>p.c.length&&p.varPer!=null&&Math.abs(p.varPer)>=0.005).map(p=>{const i0=p.all.indexOf(p.c[0]);const base=i0>0?p.all[i0-1].pn:p.c[0].pn;const u=p.c.reduce((s,x)=>s+x.q,0);return {p,base,now:p.c[p.c.length-1].pn,v:p.varPer,imp:(p.c[p.c.length-1].pn-base)*u}}).sort((a,b)=>Math.abs(b.imp)-Math.abs(a.imp));
  const sube=cambios.filter(c=>c.v>0),baja=cambios.filter(c=>c.v<0);

  return {L,tot,byProv,topObras,sube,baja,impSube,impBaja,idx,gsAh};
}

function buildOX(){

  const palias=new Map();

function similares(desc,n){ // más permisivo que valuar: raíces de palabra (EMERGENCIAS = EMERGENCIA)
  const st=w=>w.length>4?w.replace(/(ES|S)$/,''):w;const sw=f=>new Set([...f.words].map(st));
  if(!VI.sidx){VI.sidx=new Map();VI.ps.forEach((p,i)=>{p.sw=sw(p.feat);p.sw.forEach(w=>(VI.sidx.get(w)||VI.sidx.set(w,[]).get(w)).push(i))})}
  let t=normTxt(desc);SYN.forEach(([r,s])=>t=t.replace(r,s));
  const F=feats(t),W=sw(F);const cand=new Set();W.forEach(w=>{const l=VI.sidx.get(w);if(l&&l.length<600)l.forEach(i=>cand.add(i))});
  const out=[];for(const i of cand){const p=VI.ps[i];const w=jac(W,p.sw);const s=F.nums.size&&p.feat.nums.size?0.65*w+0.35*jac(F.nums,p.feat.nums):w;if(s>=0.15)out.push({p,s})}
  return out.sort((a,b)=>b.s-a.s||(a.p.f<b.p.f?1:-1)).slice(0,n||8);
}

let VI=null;
function buildValIndex(){
  const prods=new Map();
  for(const d of DOCS){if(d.tipo!=='factura'&&d.tipo!=='albaran')continue;

    for(const l of d.lineas||[]){if(!inR(l.f))continue;const id=obraL(d,l);if(id==='#excl')continue;if(!id){addSin(l.o,d.proveedor,l.i);continue}
      const o=get(id);o.mat+=l.i;o.raws.add(l.o);if(l.f>o.last)o.last=l.f;
      const ak=d.proveedor+'|'+l.a;const a=o.albs.get(ak)||{prov:d.proveedor,a:l.a,f:l.f,i:0,doc:d.tipo==='factura'?d.numero:'',raw:l.o,n:0,k:aclKey(d,l),docs:new Map()};a.docs.set(d.id||d.numero,d);a.i+=l.i;a.n++;o.albs.set(ak,a)}}
  // almacén
  for(const d of ALM){if(!inR(d.fecha))continue;const id=obraDe(d.obra);const sg=d.mov==='devolucion'?-1:1;
    for(const l of d.lineas||[]){const v=valuar(l.d);const imp=v?sg*v.p.pn*l.q:0;
      if(!id){addSin(d.obra,'almacén',imp);continue}
      const o=get(id);o.alm+=imp;o.raws.add(d.obra);if(d.fecha>o.last)o.last=d.fecha;o.almL.push({doc:d,l,v,imp,sg})}}
  // partes: horas, material de stock y devoluciones
  for(const p of PARTES){if(!inR(p.fecha))continue;const id=obraP(p);
    if(!id){if(!p.noImputar)addSin(p.obra,'parte',0);continue}
    const o=get(id);o.partes.push(p);o.raws.add(p.obra);if(p.fecha>o.last)o.last=p.fecha;o.estado=p.estado||o.estado;
    for(const op of p.ops||[]){const pid=persO(op);const pe=pid&&OX.peById.get(pid);if(pe&&pe.noPersona)continue;
      o.horas+=op.h;const r=(pe&&pe.coste_hora)||rate;o.mo+=op.h*r;const k=pid||op.n;o.ops.set(k,(o.ops.get(k)||0)+op.h)}
    for(const [arr,sg] of [[p.stock||[],1],[p.devol||[],-1]])for(const l of arr){const v=valuar(l.d);const imp=v?sg*v.p.pn*l.q:0;o.stk+=imp;o.stkL.push({p,l,v,imp,sg})}}
  for(const o of O.values()){o.tot=o.mat+o.alm+o.stk+o.mo;o.ob=OX.obById.get(o.id)}
  return {O,sin};
}

/* ---------- cotejo de albaranes ---------- */
function cotejoAlb(desde){
  const K=new Map();
  const add=(prov,n,info)=>{const k=prov+'|'+n;const x=K.get(k)||{prov,n,f:info.f,raws:new Set(),src:new Set(),partes:[],obraP:new Set(),obraS:'',i:null,emp:info.emp||''};
    if(info.f&&(!x.f||info.f<x.f))x.f=info.f;if(info.raw)x.raws.add(info.raw);x.src.add(info.src);if(info.parte){x.partes.push(info.parte);const id=obraP(info.parte);if(id)x.obraP.add(id)}
    if(info.obraS)x.obraS=info.obraS;if(info.i!=null)x.i=info.i;if(info.emp)x.emp=info.emp;K.set(k,x)};
  for(const d of DOCS)if(d.tipo==='albaran'&&d.fecha>=desde){const n=nAlb(d.proveedor,d.numero);add(d.proveedor,n,{f:d.fecha,raw:d.numero,src:'correo',obraS:d.obra,i:(d.lineas||[]).reduce((s,l)=>s+l.i,0),emp:d.empresa})}
  const otros=[];
  for(const p of PARTES){if(p.fecha<desde)continue;for(const a of p.albs||[]){const prov=provDe(a);
    if(/^\s*(INSTAPALMA|ALB-)/i.test(a)||/ALB-\d/i.test(a))continue; // albarán interno de almacén
    const n=nAlb(prov,a);if(!prov||!n){otros.push({p,a});continue}add(prov,n,{f:p.fecha,raw:a,src:'parte',parte:p})}}
  const rows=[...K.values()].map(x=>{
    let fx=OX.fact.get(x.prov+'|'+x.n);
    if(!fx&&x.n.length<5){for(const [k,v] of OX.fact)if(v.prov===x.prov&&k.endsWith(x.n)&&Math.abs(new Date(v.f)-new Date(x.f))<6*864e5){fx=v;x.aprox=true;break}}
    const cerr=Object.entries(OX.cierre).filter(([k])=>k.startsWith(x.prov+'|')&&(!x.emp||k.endsWith('|'+x.emp))).map(([,v])=>v).sort().pop()||'';
    x.fx=fx;x.estado=fx?'facturado':(cerr&&cerr>=x.f?'falta':'pendiente');x.cierre=cerr;
    if(fx&&x.i==null)x.i=fx.i;
    const os=obraDe(fx?fx.o:x.obraS);x.obraSid=os;x.obraS=fx?fx.o:x.obraS;
    x.choque=os&&x.obraP.size&&!x.obraP.has(os);
    return x}).sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
  otros.sort((a,b)=>a.p.fecha<b.p.fecha?-1:a.p.fecha>b.p.fecha?1:0);
  // facturado sin parte ni correo
  const sinRef=[];for(const [k,v] of OX.fact){if(v.f<desde||K.has(k))continue;sinRef.push(v)}
  sinRef.sort((a,b)=>a.f<b.f?-1:1);
  return {rows,otros,sinRef};
}

/* ---------- personal ---------- */
function horasMes(mes){
  const P=new Map(),sin=new Map();
  for(const p of PARTES){if(!p.fecha.startsWith(mes))continue;
    for(const op of p.ops||[]){const id=persO(op);if(!id){const s=sin.get(op.n)||{n:op.n,h:0,c:0};s.h+=op.h;s.c++;sin.set(op.n,s);continue}
      const x=P.get(id)||{id,h:0,dias:new Map(),obras:new Map()};x.h+=op.h;
      const d=x.dias.get(p.fecha)||[];d.push({p,h:op.h,o:obraP(p),raw:p.obra});x.dias.set(p.fecha,d);
      const ok=obraP(p)||('?'+p.obra);x.obras.set(ok,(x.obras.get(ok)||0)+op.h);P.set(id,x)}}
  return {P,sin};
}
function cotejoMes(mes){
  const H=horasMes(mes).P;const out=[];
  for(const r0 of RES){if(r0.mes!==mes)continue;const id=persDe(r0.operario);const x=id&&H.get(id);
    // horas de médico: no cuentan (Alberto, 2-nov-2026)
    const med=(r0.dias||[]).filter(d=>/M[EÉ]DIC/i.test(d.o||''));const r=med.length?{...r0,dias:(r0.dias||[]).filter(d=>!med.includes(d)),total:Math.round(((+r0.total||0)-med.reduce((s,d)=>s+(+d.h||0),0))*100)/100}:r0;
    const dias=new Map();for(const d of r.dias||[]){const a=dias.get(d.f)||{r:[],p:[]};a.r.push(d);dias.set(d.f,a)}
    if(x)for(const [f,arr] of x.dias){const a=dias.get(f)||{r:[],p:[]};a.p.push(...arr);dias.set(f,a)}
    const det=[...dias.entries()].sort().map(([f,a])=>{const hr=a.r.reduce((s,d)=>s+d.h,0),hp=a.p.reduce((s,d)=>s+d.h,0);
      const or=new Set(a.r.map(d=>obraDe(d.o)||'?'+keyN(d.o))),opp=new Set(a.p.map(d=>d.o||'?'+keyN(d.raw)));
      const obraDist=hr>0&&hp>0&&[...or].some(o=>!opp.has(o));
      return {f,r:a.r,p:a.p,hr,hp,dif:hp-hr,obraDist}});
    const hp=x?x.h:0;
    out.push({r,id,hp,dif:hp-r.total,nd:det.filter(d=>Math.abs(d.dif)>0.01).length,no:det.filter(d=>d.obraDist&&Math.abs(d.dif)<=0.01).length,det})}
  // operarios con partes y sin resumen
  const conRes=new Set(out.map(o=>o.id));
  const sinRes=[...H.values()].filter(x=>!conRes.has(x.id)&&!(OX.peById.get(x.id)||{}).noPersona);
  return {out:out.sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif)),sinRes};
}

const addMeses=(f,m)=>{const d=new Date(f+'T00:00:00');d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)};
function prlEst(r){if(!r)return 'falta';if(!r.caduca)return 'ok';const d=diasA(r.caduca);return d<0?'caducado':d<=PRL_AVISO?'pronto':'ok'}

  return e==='caducado'?`<span class="pill up">Caducado ${fdate(r.caduca)}</span>`:e==='pronto'?`<span class="pill up" style="background:var(--soft)">Caduca en ${d} d</span>`:`<span class="pill down">${r.caduca?'Hasta '+fdate(r.caduca):'Vigente'}</span>`};

function prlUltimos(rs){const m=new Map();for(const r of rs){const k=r.pid+'|'+r.tipo+'|'+keyN(r.concepto);if(!m.has(k))m.set(k,r)}return [...m.values()]}

function prlPend(){const ids=new Set(prlPlantilla().map(p=>p.id));return PRL.filter(r=>r.tipo==='pend'&&!r.resuelto&&ids.has(r.pid)).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''))}

let PRLAV=[];

const telWa=t=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9)d='34'+d;return d};
const fLarga=f=>{if(!f)return '';const[y,m,d]=f.split('-');return `${d}/${m}/${y}`};
function prlTexto(p,pl,o){
  const pr=p.prl||{},nom=(p.nombre||'').split(' ')[0],med=CFG.prl_med||{};
  if(pl==='oficina')return `Hola ${nom}, pásate por la oficina cuando puedas${o.motivo?' '+o.motivo.replace(/^\s*/,''):''}. Gracias.\nInstapalma`;
  if(pl==='recordatorio'){const rs=prlUltimos2(prlDe(p.id)).filter(r=>r.caduca&&prlEst(r)!=='ok').sort((a,b)=>a.caduca.localeCompare(b.caduca));
    const pe=PRL.filter(r=>r.pid===p.id&&r.tipo==='pend'&&!r.resuelto);
    const ls=[...rs.map(r=>`- ${r.concepto}: ${prlEst(r)==='caducado'?'caducó':'caduca'} el ${fLarga(r.caduca)}`),...pe.map(r=>`- ${r.concepto}`)];
    return `Hola ${nom}, te recordamos desde Instapalma que tienes pendiente:\n${ls.join('\n')||'- (nada pendiente ahora mismo)'}\nPásate por la oficina o dinos cuándo puedes para gestionarlo. Gracias.`}
  if(pl==='cita')return `Hola ${nom}, te hemos pedido cita para el reconocimiento médico${o.fecha?' el '+fLarga(o.fecha):''}${o.hora?' a las '+o.hora:''}${med.nombre?' en '+med.nombre:''}${o.lugar?' ('+o.lugar+')':''}. Ve en ayunas si te lo indican y lleva el DNI. Si no puedes ir, avísanos cuanto antes. Gracias.\nInstapalma`;
  if(pl==='pedircita')return `Buenos días,\n\nSolicitamos cita para el reconocimiento médico de ${p.nombre}${pr.puesto?' ('+pr.puesto+')':''}, trabajador de Instapalma.${o.fecha?`\nPreferiblemente a partir del ${fLarga(o.fecha)}${o.hora?' sobre las '+o.hora:''}.`:''}\n\nQuedamos a la espera de la fecha y la hora.\n\nUn saludo,\nAlberto\nInstapalma`;
  return '';
}

let WAMCP;const waMcp=async()=>{if(WAMCP===undefined){try{WAMCP=await claude.use('mcp')}catch(e){WAMCP=null}}return WAMCP};
const p2=n=>String(n).padStart(2,'0');
const ahoraMas=m=>{const d=new Date(Date.now()+m*60000);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const waErr=e=>({server_not_connected:'El conector WA no está conectado en claude.ai.',needs_reauth:'Hay que volver a conectar WA en claude.ai › Ajustes › Conectores.',not_in_manifest:'No has permitido a esta página usar WA (menú Permisos).',approval_required:'Falta tu aprobación para usar WA desde la página.',not_granted:'Este visor no permite usar conectores.',capability_disabled:'Este visor no permite usar conectores.',tool_error:'WhatsApp rechazó el mensaje: '+(e&&e.message||'')}[e&&e.code]||('No se ha podido enviar ('+(e&&e.code||'error')+'). Comprueba en WhatsApp antes de repetir.'));
async function waEnviar(p,tel,texto,pl,cuando){
  const mcp=await waMcp();if(!mcp){toast('Este visor no permite usar el conector de WhatsApp; usa el botón de abrir WhatsApp.');return false}
  try{await mcp.callTool('WA','programar_mensaje',{telefono:tel,mensaje:texto,fecha_hora:cuando||ahoraMas(1),nombre:p.nombre||''},{cache:false})}catch(e){toast(waErr(e));return false}
  if(db)db.collection('prl_avisos').add({pid:p.id,pl,canal:'whatsapp-conector',texto,cuando:cuando||'',f:new Date().toISOString()}).catch(()=>{});
  return true;
}

async function W(fn,ok){if(!db){toast('No se puede guardar: abre la página con tu sesión iniciada.');return}try{await fn();if(ok)toast(ok)}catch(e){toast('No se ha guardado: '+(e.message||e.code||e))}}
const slug=s=>keyN(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||('obra-'+Date.now());
function quitarAlias(k){return OBRAS.filter(o=>(o.alias||[]).includes(k)).map(o=>db.doc('obras/'+o.id).update({alias:o.alias.filter(a=>a!==k)}))}
async function asignar(id,k){await W(async()=>{await Promise.all(quitarAlias(k));const o=OX.obById.get(id);await db.doc('obras/'+id).update({alias:[...new Set([...(o.alias||[]),k])]})},'Asignado a '+obraNom(id))}
async function obraNueva(k,raw){const nom=raw.trim().toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());let id=slug(nom);if(OX.obById.has(id))id+='-'+Date.now().toString(36);
  await W(async()=>{await Promise.all(quitarAlias(k));await db.doc('obras/'+id).set({nombre:nom,cliente:'',alias:[k],estado:'aprobada',creado:new Date().toISOString().slice(0,10)})},'Obra creada: '+nom)}
async function unir(src,dst){if(!src||!dst||src===dst)return;const a=OX.obById.get(src),b=OX.obById.get(dst);
  await W(async()=>{await db.doc('obras/'+dst).update({alias:[...new Set([...(b.alias||[]),...(a.alias||[]),keyN(a.nombre)])]});await db.doc('obras/'+src).delete()},`Unida con ${b.nombre}`)}

/* ---------- partes de trabajo: consulta, alta y edición ---------- */
// el parte puede llevar la obra y el operario elegidos a mano (obraId, ops[].pid); si no, se casan por alias
function obraP(p){return p.obraId&&OX.obById.has(p.obraId)?p.obraId:obraDe(p.obra,p.cliente)}
function persO(op){return op.pid&&OX.peById.has(op.pid)?op.pid:persDe(op.n)}
const EST_P=['EN CURSO','TERMINADO','PENDIENTE'];
const estPP=e=>e==='TERMINADO'?'<span class="pill down">Terminado</span>':e==='PENDIENTE'?'<span class="pill up">Pendiente</span>':e?'<span class="pill flat">En curso</span>':'';
function qdJ(s){ // "3 m de cable 2,5" -> {d,q,u} (igual que partes.py)
  const m=String(s).trim().match(/^(\d+(?:[.,]\d+)?)\s*(metros|mts|mt|ml|m|uds|ud|unidades|paquetes|paquete|rollos|rollo|cajas|caja)?\.?\s*(?:de\s+)?(.*)$/i);
  if(!m||!m[3])return {d:String(s).trim(),q:1,u:''};
  let u=(m[2]||'').toLowerCase();if(['m','mt','mts','ml','metros'].includes(u))u='m';
  return {d:m[3].replace(/^[\s.]+|[\s.]+$/g,''),q:parseFloat(m[1].replace(',','.')),u};
}
const lineaTxt=l=>(l.q!==1||l.u?nfmt.format(l.q)+(l.u?' '+l.u:'')+' ':'')+l.d;
const lineas=s=>String(s||'').split('\n').map(x=>x.trim()).filter(x=>x&&x!=='-'&&x!=='—');
function filtroPartes(){
  const F=UI.pf,q=normTxt(F.q||'').trim();
  return PARTES.filter(p=>{
    if(F.desde&&p.fecha<F.desde)return false;if(F.hasta&&p.fecha>F.hasta)return false;
    if(F.est&&(p.estado||'')!==F.est)return false;
    if(F.obra){const o=obraP(p);if(F.obra==='-'?o:o!==F.obra)return false}
    if(F.op&&!(p.ops||[]).some(op=>persO(op)===F.op))return false;
    if(q){const h=normTxt([p.id,p.obra,p.cliente,p.desc,...(p.ops||[]).map(o=>o.n),...(p.albs||[]),...(p.stock||[]).map(l=>l.d)].join(' '));if(!q.split(/\s+/).every(w=>h.includes(w)))return false}

const hoy=()=>new Date().toISOString().slice(0,10);
const byF=(a,b)=>a.f<b.f?-1:a.f>b.f?1:0;
const r2=v=>Math.round(v*100)/100;
function factCfg(ob){const f=(ob&&ob.fact)||{};return {ph:+f.ph||0,mg:+f.mg||0,igic:f.igic==null||f.igic===''?7:+f.igic,tr:+f.tr||0}}
function billedKeys(id){const s=new Map();for(const f of FACT)if(f.obra===id)for(const l of f.lineas||[])for(const k of (l.ks||[l.k]))if(k)s.set(k,f.numero);return s}
function itemsObra(id){

    if(d.tipo==='albaran'&&OX.fact.has(d.proveedor+'|'+nAlb(d.proveedor,d.numero)))continue;
    for(const l of d.lineas||[]){if(obraL(d,l)!==id)continue;
      items.push({k:uniq(['m',d.proveedor,nAlb(d.proveedor,l.a||''),l.r||''].join('|')),tipo:'material',f:l.f,d:l.d,ref:l.r,q:l.q,u:'',cu:l.q?l.i/l.q:0,orig:`${d.proveedor} ${l.a||''}`.trim()})}}
  for(const d of ALM){if(obraDe(d.obra)!==id)continue;const sg=d.mov==='devolucion'?-1:1;
    (d.lineas||[]).forEach((l,i)=>{const v=valuar(l.d);items.push({k:uniq(`a|${d.numero}|${i}`),tipo:'material',f:d.fecha,d:l.d,q:sg*l.q,u:l.u||'',cu:v?v.p.pn:0,orig:`Almacén ${d.numero}`,est:!(v&&v.man),sinv:!v})})}
  for(const p of PARTES){if(obraP(p)!==id)continue;
    for(const [arr,sg,t] of [[p.stock||[],1,'s'],[p.devol||[],-1,'d']])arr.forEach((l,i)=>{const v=valuar(l.d);items.push({k:uniq(`${t}|${p.id}|${i}`),tipo:'material',f:p.fecha,d:l.d,q:sg*l.q,u:l.u||'',cu:v?v.p.pn:0,orig:`Stock parte #${p.id}`,est:!(v&&v.man),sinv:!v})});
    for(const op of p.ops||[]){if(keyN(op.n)==='TRANSPORTE'){items.push({k:uniq(`t|${p.id}`),tipo:'transporte',f:p.fecha,d:'Transporte',q:+op.h||1,orig:`Parte #${p.id}`,desc:p.desc||''});continue}
      const pid=persO(op);const pe=pid&&OX.peById.get(pid);if(pe&&pe.noPersona)continue;
      items.push({k:uniq(`h|${p.id}|${keyN(op.n)}`),tipo:'horas',f:p.fecha,d:pe?pe.nombre:op.n,op:pid||keyN(op.n),q:op.h,orig:`Parte #${p.id}`,desc:p.desc||''})}}

}
function borrador(ob){

}

const parteIdsDe=f=>{const s=new Set();for(const l of (f&&f.lineas)||[])for(const k of (l.ks||[l.k]))if(k){const m=/^[hsd]\|([^|]+)\|/.exec(k);if(m)s.add(m[1])}return s};
function partesDeFactura(f){
  // partes cuyas horas o material van en la factura + el resto de partes de la obra en el periodo (salvo los ya incluidos en otra factura)
  const ids=parteIdsDe(f),otras=new Set();
  for(const g of FACT)if(g.obra===f.obra&&g.id!==f.id)parteIdsDe(g).forEach(x=>otras.add(x));
  for(const p of PARTES)if(obraP(p)===f.obra&&p.fecha>=f.desde&&p.fecha<=f.hasta&&!otras.has(String(p.id)))ids.add(String(p.id));
  return PARTES.filter(p=>ids.has(String(p.id))).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(+a.id||0)-(+b.id||0));
}

function pedAlbLineas(p){
  if(!p.albaran)return [];
  const toks=(String(p.albaran).match(/[A-Z0-9][A-Z0-9.\/-]*\d{3,}[A-Z0-9.\/-]*/gi)||[]).map(normRef).filter(t=>t.length>=5);
  const out=[];
  for(const d of DOCS){if(d.tipo!=='albaran'&&d.tipo!=='factura')continue;
    for(const l of d.lineas||[]){const a=normRef(l.a||(d.tipo==='albaran'?d.numero:''));if(a&&toks.some(t=>a.includes(t)||t.includes(a)))out.push({...l,prov:d.proveedor,doc:d.numero,tipo:d.tipo})}}
  // las facturas repiten las líneas del albarán: quedarse con una copia por albarán
  const seen=new Map();for(const l of out){const k=normRef(l.a||l.doc);const t=seen.get(k);if(!t||(t==='albaran'&&l.tipo==='factura'))seen.set(k,l.tipo)}
  return out.filter(l=>seen.get(normRef(l.a||l.doc))===l.tipo);
}

  const q=$('#pdq');if(q)q.oninput=()=>{F.q=q.value;clearTimeout(bindPedidos.t);bindPedidos.t=setTimeout(()=>{const pos=q.selectionStart;render();const n=$('#pdq');n.focus();n.setSelectionRange(pos,pos)},250)};
  [['#pdE','estado'],['#pdO','obra'],['#pdOp','op']].forEach(([s,k])=>{const e=$(s);if(e)e.onchange=()=>{F[k]=e.value;render()}});
  const now=()=>{const d=new Date(Date.now()-new Date().getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
  const put=(id,data,msg)=>W(()=>db.doc('pedidos/'+id).update({...data,editado:new Date().toISOString()}),msg);
  document.querySelectorAll('[data-pest]').forEach(s=>s.onchange=()=>{const p=PEDS.find(x=>x.id===s.dataset.pest);const v=s.value;const d={estado:v};
    if(v==='cursado'&&!p.fcursado)d.fcursado=now();if((v==='entregado'||v==='resuelto'||v==='anulado')&&!p.fcierre)d.fcierre=now();if(v==='pendiente'){d.fcierre=null}

  document.querySelectorAll('[data-pprov]').forEach(s=>s.onchange=()=>{const p=PEDS.find(x=>x.id===s.dataset.pprov);const v=s.value;const d={prov:v||null};
    if(v&&p.estado==='pendiente'){d.estado=(v==='Almacén'||v==='Ayumar')?'resuelto':'cursado';if(!p.fcursado)d.fcursado=now();if(d.estado==='resuelto')d.fcierre=now()}
    put(p.id,d,v?'Proveedor: '+v:'Proveedor quitado')});
  document.querySelectorAll('[data-pobra]').forEach(s=>s.onchange=()=>{if(s.value)put(s.dataset.pobra,{obra:s.value},'Obra: '+obraNom(s.value))});
  document.querySelectorAll('[data-pnota]').forEach(t=>t.onchange=()=>put(t.dataset.pnota,{nota:t.value.trim()},'Nota guardada'));
  document.querySelectorAll('[data-pdopen]').forEach(b=>b.onclick=()=>{UI.pver=b.dataset.pdopen;UI.pdtx=null;history.replaceState(null,'','#pedidos/'+UI.view+'/'+encodeURIComponent(UI.pver));render();const d=$('#pDet');if(d)d.scrollIntoView({block:'start',behavior:'smooth'})});
  document.querySelectorAll('[data-pdver2]').forEach(b=>b.onclick=()=>{UI.pver=null;history.replaceState(null,'','#pedidos/'+UI.view);render()});
  document.querySelectorAll('[data-pdtx]').forEach(b=>b.onclick=()=>{UI.pdtx=b.dataset.pdtx||null;render()});
  document.querySelectorAll('[data-pdtxs]').forEach(b=>b.onclick=()=>{const v=$('#pdTx').value.trim();UI.pdtx=null;put(b.dataset.pdtxs,{texto:v},'Texto guardado')});
  document.querySelectorAll('[data-pdcopy]').forEach(b=>b.onclick=async()=>{const p=PEDS.find(x=>x.id===b.dataset.pdcopy);const t=pedLineas(p).join('\n')+'\n'+(p.obraRaw||'');try{await navigator.clipboard.writeText(t);toast('Texto copiado: pégalo en WhatsApp al proveedor')}catch(e){toast('No se ha podido copiar')}});
  document.querySelectorAll('[data-pdver]').forEach(b=>b.onclick=()=>{UI.pdopen=UI.pdopen===b.dataset.pdver?null:b.dataset.pdver;render()});
  document.querySelectorAll('[data-pnew]').forEach(b=>b.onclick=()=>{UI.pnew=b.dataset.pnew==='1';render()});
  document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{const id=b.dataset.pdel;if(UI.pdconf!==id){UI.pdconf=id;render();return}UI.pdconf=null;W(()=>db.doc('pedidos/'+id).delete(),'Pedido borrado')});
  const sv=$('#pnSave');if(sv)sv.onclick=()=>{const f=$('#pnF').value,op=$('#pnOp').value.trim(),ob=$('#pnOb').value,tx=$('#pnTx').value.trim();
    if(!f||!op||!tx){toast('Falta la fecha, el operario o el material');return}
    const id=f.replace(/[-:T]/g,'').slice(0,12)+'-'+slug(op);
    W(async()=>{await db.doc('pedidos/'+id).set({f,op,obra:ob||null,obraRaw:ob?obraNom(ob):'',texto:tx,entrega:$('#pnEn').value,estado:'pendiente',origen:'manual',creado:new Date().toISOString()});UI.pnew=false},'Pedido guardado')};

    download(`pedidos-${hoy()}.csv`,toCSV(rows))};
}

async function cobrarPDF(completo,soloFiltro){

  const tabla=(y,o)=>{pag1=false;const cs=o.columnStyles||{};Object.values(cs).forEach(v=>{if(v.halign==='right')v.cellWidth='wrap'});doc.autoTable({...grid,showFoot:'lastPage',startY:y+1,didParseCell:c=>{if(c.section==='head'&&cs[c.column.index]&&cs[c.column.index].halign==='right')c.cell.styles.halign='right'},...o});return doc.lastAutoTable.finalY+7};

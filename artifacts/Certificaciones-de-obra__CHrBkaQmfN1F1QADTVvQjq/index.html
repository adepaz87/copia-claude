<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Certificaciones de obra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera de obra + pestañas; cada vista es una hoja de mediciones con tabla ancha que desplaza en su propio contenedor. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --sunk: #eceef2;
  --line: #d6dae2;
  --fg: #1b2230;
  --muted: #5d6779;
  --accent: #1f5a8c;
  --accent-soft: #e2ecf6;
  --actual: #9a5b10;
  --actual-soft: #fbf0df;
  --good: #2f7a4b;
  --warn: #b3261e;
  --warn-soft: #fbe5e3;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --sunk: #222935; --line: #323b49; --fg: #e5e9f0; --muted: #9aa5b6;
    --accent: #7fb2e3; --accent-soft: #1f3247; --actual: #e5a85a; --actual-soft: #3a2c19;
    --good: #6cc48e; --warn: #f2867d; --warn-soft: #3d2121; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --sunk: #222935; --line: #323b49; --fg: #e5e9f0; --muted: #9aa5b6;
  --accent: #7fb2e3; --accent-soft: #1f3247; --actual: #e5a85a; --actual-soft: #3a2c19;
  --good: #6cc48e; --warn: #f2867d; --warn-soft: #3d2121; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 18px 0; display: grid; gap: 14px; }
.obra-line { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { font: 600 14px var(--font-display); letter-spacing: .02em; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 12px 10px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--fg); }
main .wrap { padding-block: 20px 48px; display: grid; gap: 18px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar .grow { flex: 1 1 auto; }
button, .btn { font: 500 13px var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.danger { color: var(--warn); }
button.armed { background: var(--warn); border-color: var(--warn); color: var(--surface); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.icon { padding: 3px 8px; font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type="text"], input[type="date"], textarea { font: 14px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { width: 100%; min-height: 140px; font-family: var(--font-num); font-size: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font-display); letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.chip.open { background: var(--actual-soft); color: var(--actual); }
.chip.closed { background: var(--accent-soft); color: var(--accent); }
.chip.ex { background: var(--warn-soft); color: var(--warn); }
.totals > .tot.good .v { color: var(--good); }
.totals > .tot.bad { border-color: var(--warn); background: var(--warn-soft); }
.totals > .tot.bad .v { color: var(--warn); }
td.neg { color: var(--warn); font-weight: 600; }
td.pos { color: var(--good); font-weight: 600; }
.cmp { display: grid; gap: 10px; }
.cmp-r { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.cmp-l { font-size: 13px; color: var(--muted); }
.cmp-t { display: flex; height: 18px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.cmp-b { display: block; height: 100%; }
.cmp-b + .cmp-b { border-left: 2px solid var(--surface); }
.cmp-v { font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.pres { background: var(--line); } .cert { background: var(--accent); } .mat { background: var(--actual); } .ope { background: color-mix(in srgb, var(--actual) 55%, var(--surface)); }
details.upd > summary { font: 600 15px var(--font-display); }
details.upd .steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
label.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 560px) { .cmp-r { grid-template-columns: 1fr auto; } .cmp-t { grid-column: 1 / -1; grid-row: 2; } }
.chip.nueva { background: var(--accent-soft); color: var(--accent); font-size: 10px; padding: 1px 6px; margin-left: 4px; }
.nf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.nf-grid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.nf-grid label.wide { grid-column: span 2; }
.nf-grid input, .nf-grid select { width: 100%; }
@media (max-width: 560px) { .nf-grid label.wide { grid-column: auto; } }

/* Resumen económico */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.totals > .tot { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.totals > .tot .v { font: 500 20px var(--font-num); font-variant-numeric: tabular-nums; }
.totals > .tot.hl { border-color: var(--actual); background: var(--actual-soft); }
.totals > .tot.hl .v { color: var(--actual); }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.progress span.over { background: var(--warn); }

/* Tablas */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
thead th { position: sticky; top: 0; background: var(--sunk); font: 600 11.5px var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; z-index: 1; }
thead tr.grp th { text-align: center; border-bottom: 0; padding-bottom: 0; }
th.g-orig, td.g-orig { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
th.g-act, td.g-act { background: var(--actual-soft); }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.code { font-family: var(--font-num); font-size: 12px; color: var(--muted); white-space: nowrap; }
td.desc { min-width: 240px; max-width: 420px; }
td.act { color: var(--actual); font-weight: 500; }
tr.cap td { background: var(--sunk); font-family: var(--font-display); font-weight: 600; font-size: 14px; }
tr.cap td.n { font-family: var(--font-num); font-weight: 500; font-size: 13px; }
tr.tot td { font-weight: 600; border-top: 2px solid var(--fg); border-bottom: 0; }
tr.over td.g-orig { color: var(--warn); }
input.cell { width: 100%; min-width: 70px; font: 13px var(--font-num); text-align: right; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; background: var(--surface); color: var(--fg); font-variant-numeric: tabular-nums; }
input.cell.txt { text-align: left; font-family: var(--font-body); }
input.cell:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
input.cell[readonly] { border-color: transparent; background: transparent; }
tr.cap input.cell { font-family: var(--font-display); font-weight: 600; font-size: 14px; background: transparent; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.form-grid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.form-grid input { width: 100%; }
.empty { text-align: center; padding: 40px 16px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h2 { color: var(--fg); }
.note { font-size: 12.5px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
details summary { cursor: pointer; font: 600 15px var(--font-display); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.cols > * { min-width: 0; }
code { font-family: var(--font-num); font-size: 12px; background: var(--sunk); padding: 1px 4px; border-radius: 3px; }
@media (max-width: 560px) { h1 { font-size: 21px; } .totals > .tot .v { font-size: 17px; } }
/* Móvil: tarjetas por partida y capítulos plegables */
.mlist { display: grid; gap: 10px; }
.busca { width: 100%; font-size: 16px !important; padding: 9px 10px !important; }
details.capd { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
details.capd > summary { list-style: none; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; cursor: pointer; }
details.capd > summary::-webkit-details-marker { display: none; }
details.capd > summary .cn { font: 600 15px var(--font-display); }
details.capd > summary .cn::before { content: "▸"; display: inline-block; width: 1em; color: var(--muted); transition: transform .15s; }
details.capd[open] > summary .cn::before { transform: rotate(90deg); }
details.capd > summary .cs { font-size: 12px; color: var(--muted); grid-column: 1; }
details.capd > summary .ca { font: 500 13px var(--font-num); color: var(--actual); grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; }
details.capd[open] > summary { border-bottom: 1px solid var(--line); }
.pc { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
.pc:last-child { border-bottom: 0; }
.pc-h { display: flex; gap: 8px; align-items: center; justify-content: space-between; font: 12px var(--font-num); color: var(--muted); }
.pc-d { font-size: 14px; overflow-wrap: anywhere; }
.pc-m { font: 12px var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.pc-in { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; }
.pc-in.three { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
.pc-in label { display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.pc input.cell, .capd input.cell { font-size: 16px; padding: 8px; min-width: 0; }
.pc-r { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; font: 12.5px var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.pc-r .act { color: var(--actual); font-weight: 500; }
.pc.over .pc-m, .pc.over input[data-q] { color: var(--warn); }
.mtot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mtot .act { color: var(--actual); }
.capd-edit { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.capd-edit .bar { grid-column: 1 / -1; }
@media (max-width: 720px) {
  .hm { display: none; }
  .totals { grid-template-columns: 1fr 1fr; gap: 8px; }
  .totals > .tot { padding: 10px 12px; }
  .totals > .tot .v { font-size: 16px; }
  .totals > .tot .eyebrow { font-size: 10.5px; }
  #certPicker { width: 100%; }
  #certPicker select { flex: 1 1 100%; font-size: 16px; }
  h1 { font-size: 21px; }
  .panel { padding: 14px; }
  main .wrap { gap: 14px; }
  .bar button { flex: 1 1 auto; }
}
.of-head { grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
.of-logo { width: 170px; max-width: 40vw; background: #fff; border-radius: 4px; padding: 4px; justify-self: end; }
.of-who { display: grid; gap: 1px; font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.of-who strong { color: var(--fg); }
@media (max-width: 560px) { .of-head { grid-template-columns: 1fr; } .of-logo { justify-self: start; grid-row: 1; } }
.of-estado { font-size: 12.5px; color: var(--muted); }
.of-estado[data-e="pend"] { color: var(--actual); font-weight: 600; }
.of-estado[data-e="error"] { color: var(--warn); font-weight: 600; }
.of-estado[data-e="ok"] { color: var(--good); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="obra-line">
      <div>
        <div class="eyebrow">Certificación de obra</div>
        <h1 id="obraNombre">Cargando…</h1>
        <div class="meta" id="obraMeta"></div>
      </div>
      <div class="bar" id="certPicker"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-view="cert" id="tab-cert">Certificación</button>
      <button role="tab" data-view="resumen" id="tab-resumen">Resumen</button>
      <button role="tab" data-view="costes" id="tab-costes">Coste vs certificado</button>
      <button role="tab" data-view="pres" id="tab-pres">Presupuesto</button>
      <button role="tab" data-view="obra" id="tab-obra">Datos de obra</button>
      <button role="tab" data-view="oferta" id="tab-oferta">Ofertas</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // ---------- utilidades ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const f2 = new Intl.NumberFormat("es-ES", { useGrouping: "always", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const f3 = new Intl.NumberFormat("es-ES", { useGrouping: "always", minimumFractionDigits: 0, maximumFractionDigits: 3 });
  const f1 = new Intl.NumberFormat("es-ES", { useGrouping: "always", minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const eur = (v) => f2.format(v || 0) + " €";
  const qty = (v) => (v ? f3.format(v) : "");
  const pct = (v) => f1.format(v || 0) + " %";
  const r2 = (v) => Math.round((v + Number.EPSILON) * 100) / 100;
  const r3 = (v) => Math.round((v + Number.EPSILON) * 1000) / 1000;
  const uid = () => Math.random().toString(36).slice(2, 10);
  const today = () => new Date().toISOString().slice(0, 10);
  const fecha = (iso) => (iso ? iso.split("-").reverse().join("/") : "");
  // Acepta "1.234,56", "1234,56", "1234.56"
  function num(s) {
    if (typeof s === "number") return isFinite(s) ? s : 0;
    s = String(s ?? "").trim().replace(/[\s€%]/g, "");
    if (!s) return 0;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  const OBRA_DEF = { nombre: "", cliente: "", direccion: "", contrato: "", gg: 0, bi: 0, baja: 0, iva: 21, impuesto: "IVA", retencion: 0 };
  const S = {
    db: null, downloads: null, loaded: { obra: false, pres: false, certs: false, ofertas: false }, ofertas: [], ofSel: null,
    obra: { ...OBRA_DEF }, pres: { capitulos: [], partidas: [] }, certs: [],
    sel: null, view: "cert", readOnly: false, offline: false, nf: {}, open: new Set(), busca: "", costes: null, syncPedida: null, syncDesde: "",
  };

  // ---------- persistencia ----------
  let chain = Promise.resolve();
  function write(fn) {
    chain = chain.then(fn).catch((e) => {
      if (e && e.code === "invalid_argument" && !S.readOnly) { S.readOnly = true; toast("No tienes permiso para modificar esta obra. Se muestra en solo lectura."); render(); }
      else if (e && e.code === "quota_exceeded") toast("El almacenamiento está lleno: " + (e.message || ""));
      else toast("No se pudo guardar. Revisa la conexión y vuelve a intentarlo.");
    });
    return chain;
  }
  const savePres = () => { const body = JSON.parse(JSON.stringify(S.pres)); if (S.db) write(() => S.db.doc("obra/presupuesto").set(body)); };
  const saveObra = () => { const body = { ...S.obra }; if (S.db) write(() => S.db.doc("obra/datos").set(body)); };
  const updCert = (id, patch) => { if (S.db) write(() => S.db.doc("certificaciones/" + id).update(patch)); };
  const setCert = (id, body) => { if (S.db) write(() => S.db.doc("certificaciones/" + id).set(body)); };
  const delCert = (id) => { if (S.db) write(() => S.db.doc("certificaciones/" + id).delete()); };

  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3600); }

  // ---------- cálculos ----------
  const capOf = (id) => S.pres.capitulos.find((c) => c.id === id);
  const partidasDe = (capId) => S.pres.partidas.filter((p) => p.cap === capId);
  const certSel = () => S.certs.find((c) => c.id === S.sel) || null;
  const prevCert = (c) => (c ? S.certs.filter((x) => x.numero < c.numero).sort((a, b) => b.numero - a.numero)[0] : null);
  const lastCert = () => S.certs[S.certs.length - 1] || null;

  function calc(c) {
    const o = (c && c.origen) || {}, prev = prevCert(c), a = (prev && prev.origen) || {};
    const rows = {}, caps = {};
    const T = { pres: 0, orig: 0, ant: 0, act: 0 };
    for (const cap of S.pres.capitulos) caps[cap.id] = { pres: 0, orig: 0, ant: 0, act: 0 };
    for (const p of S.pres.partidas) {
      const pr = num(p.precio), med = num(p.med);
      const qO = num(o[p.id]), qA = num(a[p.id]);
      const iP = r2(med * pr), iO = r2(qO * pr), iA = r2(qA * pr);
      const row = { qO, qA, qC: r3(qO - qA), iP, iO, iA, iC: r2(iO - iA), pc: med ? (qO / med) * 100 : 0, over: med > 0 && qO > med + 1e-9 };
      rows[p.id] = row;
      const k = caps[p.cap] || (caps[p.cap] = { pres: 0, orig: 0, ant: 0, act: 0 });
      k.pres += iP; k.orig += iO; k.ant += iA; k.act += row.iC;
      T.pres += iP; T.orig += iO; T.ant += iA; T.act += row.iC;
    }
    return { rows, caps, T };
  }
  function econ(pem) {
    const o = S.obra, gg = r2(pem * num(o.gg) / 100), bi = r2(pem * num(o.bi) / 100);
    const pec = r2(pem + gg + bi), baja = r2(pec * num(o.baja) / 100), base = r2(pec - baja);
    return { pem, gg, bi, pec, baja, base };
  }
  function liquidacion(T) {
    const eO = econ(T.orig), eA = econ(T.ant);
    const base = r2(eO.base - eA.base), iva = r2(base * num(S.obra.iva) / 100), ret = r2(base * num(S.obra.retencion) / 100);
    return { eO, eA, base, iva, ret, liquido: r2(base + iva - ret) };
  }

  // ---------- render ----------

    else if (!loaded) v.innerHTML = `<div class="panel empty"><h2>Cargando la obra…</h2></div>`;
    else ({ cert: viewCert, resumen: viewResumen, costes: viewCostes, pres: viewPres, obra: viewObra, oferta: viewOferta }[S.view] || viewCert)(v);
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (_) {} } }

      ${row("Base imponible", L.eO.base, L.eA.base, L.base, true)}

      </div>`;

  // ---------- coste vs certificado ----------
  function costesData(K) {
    const mat = (K.material || []).map((x) => ({ ...x, tipo: "m", imp: num(x.importe) }));
    const mo = (K.manoobra || []).map((x) => ({ ...x, tipo: "o", imp: x.importe != null && x.importe !== "" ? num(x.importe) : r2(num(x.horas) * num(x.costeHora)) }));
    const all = [...mat, ...mo];
    const cM = r2(mat.reduce((s, x) => s + x.imp, 0)), cO = r2(mo.reduce((s, x) => s + x.imp, 0)), cT = r2(cM + cO);
    const horas = mo.reduce((s, x) => s + num(x.horas), 0);
    const last = lastCert(), base = (c) => (c ? liquidacion(calc(c).T).eO.base : 0);
    const presBase = econ(calc(null).T.pres).base, cert = base(last);
    const marg = r2(cert - cT), margPct = cert ? (marg / cert) * 100 : 0;
    const sum = (arr, t) => r2(arr.filter((x) => x.tipo === t).reduce((s, x) => s + x.imp, 0));
    // Reparto por periodos de certificación (según la fecha de cada albarán o parte)
    const per = []; let prevF = "";
    for (const c of S.certs) {
      const f = c.fecha || "", cs = all.filter((x) => x.fecha && x.fecha > prevF && x.fecha <= f);
      per.push({ lbl: `Nº ${c.numero}`, rango: `${prevF ? fecha(prevF) : "Inicio"} – ${fecha(f)}`, cert: r2(base(c) - base(prevCert(c))), m: sum(cs, "m"), o: sum(cs, "o") });
      prevF = f;
    }
    const after = all.filter((x) => x.fecha && x.fecha > prevF), sinF = all.filter((x) => !x.fecha);
    if (after.length) per.push({ lbl: "Sin certificar", rango: `Desde ${prevF ? fecha(prevF) : "el inicio"}`, cert: 0, m: sum(after, "m"), o: sum(after, "o") });
    if (sinF.length) per.push({ lbl: "Sin fecha", rango: `${sinF.length} documentos sin fecha`, cert: 0, m: sum(sinF, "m"), o: sum(sinF, "o") });
    const group = (arr, key) => { const g = {}; for (const x of arr) { const k = String(x[key] || "Sin indicar").trim(); (g[k] = g[k] || { imp: 0, h: 0, n: 0 }); g[k].imp += x.imp; g[k].h += num(x.horas); g[k].n++; } return Object.entries(g).sort((a, b) => b[1].imp - a[1].imp); };
    return { mat, mo, cM, cO, cT, horas, last, presBase, cert, marg, margPct, per, prov: group(mat, "proveedor"), ops: group(mo, "operario") };
  }

  function actualizarHTML() {
    if (S.readOnly) return "";
    return `<details class="panel upd" id="updBox" ${S.costes ? "" : "open"}><summary>Actualizar costes</summary>
      <ol class="note steps"><li>Abre <a href="https://claude.ai/artifact/GpG3J8aU1LyPDGyyoBbHHh" target="_blank" rel="noopener">Costes de obra</a> y pulsa <strong>Exportar Excel</strong>.</li><li>Elige aquí ese archivo. Se sustituyen los costes de esta pantalla por los del Excel.</li></ol>
      <div class="bar"><label class="btn primary" for="fileCostes">Elegir Excel de costes</label><input type="file" id="fileCostes" accept=".xlsx,.xls" hidden></div></details>`;

  function viewCostes(v) {
    const K = S.costes;
    if (!K) {
      v.innerHTML = `<div class="panel empty"><h2>Todavía no hay costes enlazados</h2><p>Trae los costes de material y operarios desde la herramienta de costes con su Excel.</p></div>${actualizarHTML()}`;
      return;
    }
    const D = costesData(K), { cM, cO, cT, cert, marg, presBase, last } = D;
    const mx = Math.max(presBase, cert, cT) || 1, w = (x) => Math.max(0, Math.min(100, (x / mx) * 100)).toFixed(2);
    const perRows = D.per.map((p) => { const c = r2(p.m + p.o), d = r2(p.cert - c);
      return `<tr><td><strong>${p.lbl}</strong><div class="note">${p.rango}</div></td><td class="n">${f2.format(p.cert)}</td><td class="n hm">${f2.format(p.m)}</td><td class="n hm">${f2.format(p.o)}</td><td class="n">${f2.format(c)}</td><td class="n ${d < 0 ? "neg" : "pos"}">${f2.format(d)}</td></tr>`; }).join("");

  // Lee el Excel exportado desde Costes de obra (hojas Material y Operarios)
  async function importarCostes(file) {
    S.syncPedida = null;
    await loadLibs("xlsx");
    const X = window.XLSX, wb = X.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    const rows = (name) => { const ws = wb.Sheets[name]; if (!ws) return null; const a = X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" }); const i = a.findIndex((r) => String(r[0]).trim().toLowerCase() === "fecha"); return i < 0 ? null : a.slice(i + 1).filter((r) => r.some((c) => c !== "")); };
    const iso = (v) => {
      if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      if (typeof v === "number" && v > 20000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.toISOString().slice(0, 10); }
      const s = String(v || "").trim(), m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : "";
    };
    const M = rows("Material"), O = rows("Operarios");
    if (!M || !O) throw new Error("Este Excel no tiene las hojas Material y Operarios. Usa el que genera «Exportar Excel» en Costes de obra.");
    const doc = {
      actualizado: new Date().toISOString(), fuente: "https://claude.ai/artifact/GpG3J8aU1LyPDGyyoBbHHh", origen: file.name,
      material: M.map((r) => ({ fecha: iso(r[0]), proveedor: String(r[1] || ""), numero: String(r[2] || ""), concepto: String(r[3] || ""), importe: num(r[4]) })),
      manoobra: O.map((r) => ({ fecha: iso(r[0]), operario: String(r[1] || ""), horas: num(r[3]), costeHora: num(r[4]), importe: num(r[5]) })),
    };
    S.costes = doc; render();
    await write(() => S.db.doc("costes/resumen").set(doc));
    const D = costesData(doc);
    toast(`Costes actualizados: ${doc.material.length} albaranes (${eur(D.cM)}) y ${doc.manoobra.length} partes (${eur(D.cO)}).`);
  }

  // El botón avisa a Claude con un comentario; Claude lee Costes de obra y reescribe costes/resumen
  async function pedirSync(btn) {
    btn.disabled = true;
    const fallo = (msg) => { toast(msg); btn.disabled = false; };
    try {
      const cm = window.claude && window.claude.use ? await window.claude.use("comments") : null;
      if (!cm) return fallo("Desde esta vista no se puede avisar a Claude. Usa «Subir el Excel de costes» o pídelo en el chat del proyecto.");
      const st = await cm.canSendToClaude().catch(() => "off");
      if (st !== "available") return fallo(st === "no_session" ? "Ahora mismo no hay ninguna sesión de Claude escuchando. Pídelo en el chat del proyecto o sube el Excel de costes." : "Desde esta vista no se puede avisar a Claude. Usa «Subir el Excel de costes».");
      const anchor = await cm.anchorFor(btn);
      await cm.sendToClaude({ anchor, text: "Actualizar costes: lee material, manoobra y obra/info de Costes de obra (https://claude.ai/artifact/GpG3J8aU1LyPDGyyoBbHHh) y reescribe costes/resumen de esta página." });
      S.syncPedida = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); S.syncDesde = (S.costes && S.costes.actualizado) || "";
      render(); toast("Pedido enviado a Claude. La comparativa se actualizará sola en cuanto termine.");
    } catch (e) {
      fallo(e && e.code === "consent_required" ? "Hace falta que permitas a la página comentar en tu nombre para avisar a Claude." : e && e.code === "rate_limited" ? "Has pedido varias actualizaciones seguidas. Espera un poco." : "No se pudo avisar a Claude. Prueba otra vez o sube el Excel de costes.");
    }
  }

      ${S.pres.capitulos.length && !isMob() ? `<div class="scroll"><table>
        <thead><tr><th>Código</th><th>Descripción</th><th>Ud</th><th class="n">Medición</th><th class="n">Precio</th><th class="n">Importe</th><th></th></tr></thead>
        <tbody>${body}<tr class="tot"><td></td><td colspan="4">Total ejecución material</td><td class="n">${f2.format(T.pres)}</td><td></td></tr></tbody></table></div>` : ""}
      ${ro ? "" : `<div class="bar"><button id="btnAddCap">+ Capítulo</button><span class="grow"></span>${S.pres.capitulos.length ? `<button class="danger" id="btnVaciar">Vaciar presupuesto</button>` : ""}</div>`}`;
  }

  function viewObra(v) {
    const o = S.obra, ro = S.readOnly ? "readonly" : "";
    const fld = (k, lbl, mode) => `<label>${lbl}<input type="text" id="ob-${k}" data-ob="${k}" value="${esc(mode === "n" ? f3.format(num(o[k])) : o[k])}" ${mode === "n" ? 'inputmode="decimal"' : ""} ${ro}></label>`;
    v.innerHTML = `<div class="panel"><h2>Datos de la obra</h2><div class="form-grid">
        ${fld("nombre", "Nombre de la obra")}${fld("cliente", "Cliente / promotor")}${fld("direccion", "Emplazamiento")}${fld("contrato", "Nº de contrato o expediente")}
      </div></div>
      <div class="panel"><h2>Condiciones económicas</h2><div class="form-grid">
        ${fld("gg", "Gastos generales (%)", "n")}${fld("bi", "Beneficio industrial (%)", "n")}${fld("baja", "Baja de adjudicación (%)", "n")}${fld("impuesto", "Impuesto (IVA, IGIC…)")}${fld("iva", "Tipo del impuesto (%)", "n")}${fld("retencion", "Retención de garantía (%)", "n")}
      </div><p class="note">Se aplican sobre el PEM en cada certificación. Pon 0 en lo que no corresponda; las líneas a 0 no aparecen en la liquidación.</p></div>`;
  }

  function ofEstadoHTML() {

  }

    const ae = document.activeElement;

    btn.disabled = false;

  function ofTotales(of) {

    const base = r2(rows.reduce((s, p) => s + p.imp, 0)), iva = r2(base * num(of.iva) / 100);
    return { rows, base, iva, total: r2(base + iva) };
  }

    if (t.dataset.pid) {
      const p = S.pres.partidas.find((x) => x.id === t.dataset.pid); if (!p) return;
      const f = t.dataset.f; p[f] = f === "med" || f === "precio" ? num(t.value) : t.value.trim(); savePres(); render(); return;
    }
    if (t.dataset.ob) { const k = t.dataset.ob; S.obra[k] = ["gg", "bi", "baja", "iva", "retencion"].includes(k) ? num(t.value) : t.value.trim(); saveObra(); render(); return; }
    if (t.id === "fileCostes" && t.files[0]) {
      try { await importarCostes(t.files[0]); } catch (err) { toast(err.message || "No se pudo leer el Excel de costes."); }
      t.value = ""; return;
    }
    if (t.id === "fileBc3" && t.files[0]) {
      try {
        const buf = await t.files[0].arrayBuffer();
        aplicarImport(parseBC3(new TextDecoder("windows-1252").decode(buf)));
      } catch (err) { toast(err.message || "No se pudo leer el archivo BC3."); }
      t.value = "";
    }
  });
  // Enter en una celda pasa a la siguiente fila
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || !e.target.classList.contains("cell")) return;
    e.preventDefault();
    const all = [...document.querySelectorAll(`input.cell[data-${e.target.dataset.q ? "q" : e.target.dataset.p ? "p" : "f"}]`)];
    const i = all.indexOf(e.target); e.target.blur(); e.target.dispatchEvent(new Event("change", { bubbles: true }));
    const next = all[i + 1] && document.getElementById(all[i + 1].id); if (next) { next.focus(); next.select(); }
  });

  // ---------- importación ----------
  function aplicarImport(res) {
    if (!res.partidas.length) throw new Error("No se encontró ninguna partida en los datos importados.");
    const old = new Map(S.pres.partidas.map((p) => [p.codigo, p.id]));
    let kept = 0;
    for (const p of res.partidas) if (old.has(p.codigo)) { p.id = old.get(p.codigo); old.delete(p.codigo); kept++; }
    S.pres = res; savePres(); render();
    toast(`Importadas ${res.partidas.length} partidas en ${res.capitulos.length} capítulos${kept && S.certs.length ? ` (${kept} conservan lo certificado)` : ""}.`);
  }

  function parsePaste(txt) {
    const out = { capitulos: [], partidas: [] }; let cap = null;
    for (const line of txt.split(/\r?\n/)) {
      if (!line.trim()) continue;
      const c = (line.includes("\t") ? line.split("\t") : line.split(";")).map((x) => x.trim());
      const [codigo, desc, ud, med, precio] = c;
      if (/descrip/i.test(desc || "") && /precio/i.test(c.join(" "))) continue; // cabecera
      if (!ud && !precio) { cap = { id: uid(), codigo: codigo || String(out.capitulos.length + 1).padStart(2, "0"), nombre: desc || codigo }; out.capitulos.push(cap); continue; }
      if (!cap) { cap = { id: uid(), codigo: "01", nombre: "Capítulo 1" }; out.capitulos.push(cap); }
      out.partidas.push({ id: uid(), cap: cap.id, codigo: codigo || "", desc: desc || "", ud: ud || "", med: num(med), precio: num(precio) });
    }
    return out;
  }

  // Lector FIEBDC-3 (registros ~C, ~D, ~M)
  function parseBC3(text) {
    const C = {}, D = {}, M = {}; let root = null;
    const clean = (s) => String(s || "").trim().replace(/#+$/, "");
    const nd = (s) => { const n = parseFloat(String(s || "").trim()); return isFinite(n) ? n : 0; };
    for (const rec of text.split("~").slice(1)) {
      const type = rec[0], f = rec.slice(2).split("|").map((x) => x.replace(/[\r\n]+/g, ""));
      if (type === "C") {
        const raw = (f[0] || "").split("\\")[0].trim(); if (!raw) continue;
        const code = clean(raw);
        C[code] = { chap: /#$/.test(raw), ud: (f[1] || "").trim(), res: (f[2] || "").trim(), precio: nd((f[3] || "").split("\\")[0]) };
        if (/##$/.test(raw)) root = code;
      } else if (type === "D") {
        const parts = (f[1] || "").split("\\"), ch = [];
        for (let i = 0; i + 2 < parts.length + 1; i += 3) { const k = clean(parts[i]); if (!k) continue; ch.push({ code: k, factor: parts[i + 1] ? nd(parts[i + 1]) : 1, rend: nd(parts[i + 2]) }); }
        D[clean(f[0])] = ch;
      } else if (type === "M") {
        const [pa, hi] = (f[0] || "").split("\\");
        if (f[2] !== undefined && f[2].trim() !== "") M[clean(pa) + "\\" + clean(hi)] = nd(f[2]);
      }
    }
    if (!root) throw new Error("El archivo no parece un BC3 válido: falta el concepto raíz (código terminado en ##).");
    const out = { capitulos: [], partidas: [] }, seen = new Set();
    const walk = (code, cap) => {
      for (const d of D[code] || []) {
        const c = C[d.code]; if (!c) continue;
        if (c.chap) {
          if (seen.has(d.code)) continue; seen.add(d.code);
          const k = { id: uid(), codigo: d.code, nombre: c.res }; out.capitulos.push(k); walk(d.code, k);
        } else {
          if (!cap) { cap = { id: uid(), codigo: "00", nombre: "Sin capítulo" }; out.capitulos.push(cap); }
          const m = M[code + "\\" + d.code];
          out.partidas.push({ id: uid(), cap: cap.id, codigo: d.code, desc: c.res, ud: c.ud, med: r3(m !== undefined ? m : d.rend * (d.factor || 1)), precio: c.precio });
        }
      }
    };
    walk(root, null);
    out.capitulos = out.capitulos.filter((k) => out.partidas.some((p) => p.cap === k.id));
    if (C[root] && C[root].res && !S.obra.nombre) { S.obra.nombre = C[root].res; saveObra(); }
    return out;
  }

  // ---------- exportación (PDF y Excel) ----------
  const LIBS = {
    xlsx: ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"],
    pdf: ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"],
  };
  const loaded = {};
  function loadScript(src) {
    return loaded[src] || (loaded[src] = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = src; s.onload = res;
      s.onerror = () => { delete loaded[src]; rej(new Error("No se pudo cargar el generador de archivos. Revisa la conexión.")); };
      document.head.appendChild(s);
    }));
  }
  async function loadLibs(k) { for (const src of LIBS[k]) await loadScript(src); }

  // Filas comunes a PDF y Excel
  function certTabla(c) {
    const { rows, caps, T } = calc(c), L = liquidacion(T), out = [];
    for (const k of S.pres.capitulos) {
      const ps = partidasDe(k.id); if (!ps.length) continue;
      const x = caps[k.id];
      out.push({ cap: true, codigo: k.codigo, desc: k.nombre, iP: x.pres, iO: x.orig, iA: x.ant, iC: x.act });
      for (const p of ps) { const r = rows[p.id]; out.push({ codigo: p.codigo, desc: p.nueva ? p.desc + " [partida nueva]" : p.desc, ud: p.ud, med: num(p.med), precio: num(p.precio), ...r }); }
    }
    return { out, T, L };
  }
  function liqFilas(L) {
    const o = S.obra, imp = o.impuesto || "IVA", f = [["Presupuesto de ejecución material", L.eO.pem, L.eA.pem, r2(L.eO.pem - L.eA.pem)]];
    if (num(o.gg)) f.push([`Gastos generales (${f3.format(num(o.gg))} %)`, L.eO.gg, L.eA.gg, r2(L.eO.gg - L.eA.gg)]);
    if (num(o.bi)) f.push([`Beneficio industrial (${f3.format(num(o.bi))} %)`, L.eO.bi, L.eA.bi, r2(L.eO.bi - L.eA.bi)]);
    if (num(o.baja)) f.push([`Baja de adjudicación (−${f3.format(num(o.baja))} %)`, -L.eO.baja, -L.eA.baja, -r2(L.eO.baja - L.eA.baja)]);
    f.push(["Base imponible", L.eO.base, L.eA.base, L.base]);
    f.push([`${imp} (${f3.format(num(o.iva))} %)`, null, null, L.iva]);
    if (num(o.retencion)) f.push([`Retención de garantía (−${f3.format(num(o.retencion))} %)`, null, null, -L.ret]);
    f.push(["Líquido a percibir", null, null, L.liquido]);
    return f;
  }
  const nombreArchivo = (c, ext) => `Certificacion-${String(c.numero).padStart(2, "0")}-${(S.obra.nombre || "obra").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40)}.${ext}`;

  async function guardar(filename, data) {
    try { await S.downloads.save({ filename, data }); toast("Archivo preparado: " + filename); }
    catch (err) { if (err && err.code !== "declined") toast("No se pudo descargar el archivo."); }
  }

  async function exportXlsx(btn) {
    const c = certSel(); if (!c || !S.downloads) return;
    btn.disabled = true;
    try {
      await loadLibs("xlsx");
      const X = window.XLSX, { out, T, L } = certTabla(c), o = S.obra;
      const aoa = [
        [o.nombre || "Obra"], [`Certificación nº ${c.numero}`, "", "Fecha", fecha(c.fecha)],
        ["Cliente", o.cliente || ""], ["Contrato", o.contrato || ""], [],
        ["", "", "", "PRESUPUESTO", "", "", "A ORIGEN", "", "", "ANTERIOR", "", "ACTUAL", ""],
        ["Código", "Descripción", "Ud", "Medición", "Precio", "Importe", "Cantidad", "%", "Importe", "Cantidad", "Importe", "Cantidad", "Importe"],
      ];
      const head = aoa.length, capRows = [];
      for (const r of out) {
        if (r.cap) { capRows.push(aoa.length); aoa.push([r.codigo, r.desc, "", "", "", r2(r.iP), "", "", r2(r.iO), "", r2(r.iA), "", r2(r.iC)]); }
        else aoa.push([r.codigo, r.desc, r.ud, r.med, r.precio, r.iP, r.qO || null, r.qO ? r2(r.pc) / 100 : null, r.iO || null, r.qA || null, r.iA || null, r.qC || null, r.iC || null]);
      }
      const totRow = aoa.length;
      aoa.push(["", "TOTAL EJECUCIÓN MATERIAL", "", "", "", r2(T.pres), "", T.pres ? T.orig / T.pres : 0, r2(T.orig), "", r2(T.ant), "", r2(T.act)], []);
      const liqStart = aoa.length;
      aoa.push(["", "LIQUIDACIÓN", "", "", "", "", "", "", "A origen", "", "Anterior", "", "Esta certificación"]);
      for (const [lbl, a, b, act] of liqFilas(L)) aoa.push(["", lbl, "", "", "", "", "", "", a, "", b, "", act]);
      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [{ wch: 12 }, { wch: 60 }, { wch: 6 }, { wch: 11 }, { wch: 11 }, { wch: 13 }, { wch: 11 }, { wch: 8 }, { wch: 13 }, { wch: 11 }, { wch: 13 }, { wch: 11 }, { wch: 13 }];
      ws["!merges"] = [{ s: { r: 5, c: 3 }, e: { r: 5, c: 5 } }, { s: { r: 5, c: 6 }, e: { r: 5, c: 8 } }, { s: { r: 5, c: 9 }, e: { r: 5, c: 10 } }, { s: { r: 5, c: 11 }, e: { r: 5, c: 12 } }];
      const money = new Set([4, 5, 8, 10, 12]), qtyC = new Set([3, 6, 9, 11]);
      for (let R = head; R < aoa.length; R++) for (let C = 0; C < 13; C++) {
        const cell = ws[X.utils.encode_cell({ r: R, c: C })]; if (!cell || cell.t !== "n") continue;
        cell.z = C === 7 ? "0.0%" : money.has(C) || R >= liqStart ? "#,##0.00 €" : qtyC.has(C) ? "#,##0.###" : "General";
      }
      ws["!autofilter"] = undefined; void capRows; void totRow;
      const wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, ws, `Certificación ${c.numero}`);
      const buf = X.write(wb, { bookType: "xlsx", type: "array" });
      await guardar(nombreArchivo(c, "xlsx"), new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    } catch (err) { toast(err.message || "No se pudo generar el Excel."); }
    finally { btn.disabled = false; }
  }

  async function exportPdf(btn) {
    const c = certSel(); if (!c || !S.downloads) return;
    btn.disabled = true;
    try {
      await loadLibs("pdf");
      const { jsPDF } = window.jspdf, doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      const { out, T, L } = certTabla(c), o = S.obra, W = doc.internal.pageSize.getWidth(), M = 12;
      const n2 = (v) => (v ? f2.format(v) : ""), n3 = (v) => (v ? f3.format(v) : "");
      const ink = [27, 34, 48], blue = [31, 90, 140], ochre = [154, 91, 16], grey = [93, 103, 121];
      doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...ink);
      doc.text(`CERTIFICACIÓN Nº ${c.numero}`, M, 16);
      doc.setFontSize(11); doc.text(o.nombre || "", M, 23);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...grey);
      const meta = [o.cliente && "Cliente: " + o.cliente, o.direccion, o.contrato && "Contrato: " + o.contrato].filter(Boolean);
      meta.forEach((t, i) => doc.text(t, M, 28.5 + i * 4.5));
      doc.setFont("helvetica", "bold"); doc.setTextColor(...ink); doc.setFontSize(10);
      doc.text(`Fecha: ${fecha(c.fecha)}`, W - M, 16, { align: "right" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...grey);
      doc.text(c.estado === "cerrada" ? "Certificación cerrada" : "Borrador", W - M, 21, { align: "right" });
      const startY = 30 + meta.length * 4.5;

      const body = out.map((r) => r.cap
        ? [{ content: r.codigo, styles: { fontStyle: "bold" } }, { content: r.desc, colSpan: 4, styles: { fontStyle: "bold" } }, n2(r.iP), "", "", n2(r.iO), "", n2(r.iA), "", n2(r.iC)].map((x) => (typeof x === "string" ? { content: x, styles: { fontStyle: "bold", fillColor: [236, 238, 242] } } : { ...x, styles: { ...x.styles, fillColor: [236, 238, 242] } }))
        : [r.codigo, r.desc, r.ud, n3(r.med), n2(r.precio), n2(r.iP), n3(r.qO), r.qO ? f1.format(r.pc) : "", n2(r.iO), n3(r.qA), n2(r.iA), n3(r.qC), n2(r.iC)]);
      body.push(["", { content: "TOTAL EJECUCIÓN MATERIAL", colSpan: 4 }, f2.format(T.pres), "", T.pres ? f1.format((T.orig / T.pres) * 100) : "", f2.format(T.orig), "", f2.format(T.ant), "", f2.format(T.act)].map((x) => (typeof x === "string" ? { content: x, styles: { fontStyle: "bold" } } : { ...x, styles: { fontStyle: "bold" } })));

      const right = { halign: "right" };
      doc.autoTable({
        startY, margin: { left: M, right: M, bottom: 16 }, theme: "grid",
        head: [[{ content: "PRESUPUESTO", colSpan: 6 }, { content: "A ORIGEN", colSpan: 3 }, { content: "ANTERIOR", colSpan: 2 }, { content: "ACTUAL", colSpan: 2 }],
          ["Código", "Descripción", "Ud", "Medición", "Precio", "Importe", "Cant.", "%", "Importe", "Cant.", "Importe", "Cant.", "Importe"]],
        body,
        styles: { font: "helvetica", fontSize: 7, cellPadding: 1.2, lineColor: [214, 218, 226], lineWidth: 0.1, textColor: ink, valign: "middle" },
        headStyles: { fillColor: blue, textColor: 255, halign: "center", fontSize: 7 },
        columnStyles: { 0: { cellWidth: 18 }, 1: { cellWidth: "auto" }, 2: { cellWidth: 9 }, 3: { ...right, cellWidth: 15 }, 4: { ...right, cellWidth: 16 }, 5: { ...right, cellWidth: 19 },
          6: { ...right, cellWidth: 14 }, 7: { ...right, cellWidth: 12 }, 8: { ...right, cellWidth: 19 }, 9: { ...right, cellWidth: 14 }, 10: { ...right, cellWidth: 19 },
          11: { ...right, cellWidth: 14, textColor: ochre }, 12: { ...right, cellWidth: 19, textColor: ochre, fontStyle: "bold" } },
      });

      let y = doc.lastAutoTable.finalY + 8;
      if (y > doc.internal.pageSize.getHeight() - 80) { doc.addPage(); y = 16; }
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...ink); doc.text("LIQUIDACIÓN", M, y);
      const liq = liqFilas(L).map(([lbl, a, b, act], i, arr) => {
        const strong = lbl === "Base imponible" || i === arr.length - 1;
        return [lbl, a == null ? "" : f2.format(a), b == null ? "" : f2.format(b), f2.format(act) + " €"].map((t) => ({ content: t, styles: strong ? { fontStyle: "bold" } : {} }));
      });
      doc.autoTable({
        startY: y + 3, margin: { left: M }, tableWidth: 150, theme: "plain",
        head: [["Concepto", "A origen", "Anterior", "Esta certificación"]], body: liq,
        styles: { fontSize: 8.5, cellPadding: 1.4, textColor: ink }, headStyles: { textColor: grey, fontStyle: "bold" },
        columnStyles: { 1: right, 2: right, 3: { ...right, textColor: ochre } },
        didDrawCell: (d) => { if (d.section === "body" && d.row.index === liq.length - 1 && d.column.index === 0) { doc.setDrawColor(...ink); doc.setLineWidth(0.4); doc.line(M, d.cell.y, M + 150, d.cell.y); } },
      });

      // Firmas
      y = doc.lastAutoTable.finalY + 14;
      if (y > doc.internal.pageSize.getHeight() - 32) { doc.addPage(); y = 24; }
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...grey);
      const bw = 80, gap = (W - 2 * M - 2 * bw);
      [["El contratista", M], ["Conforme, la propiedad / dirección facultativa", M + bw + gap]].forEach(([t, x]) => {
        doc.text(t, x, y); doc.setDrawColor(...grey); doc.setLineWidth(0.2); doc.line(x, y + 20, x + bw, y + 20); doc.text("Fdo.:", x, y + 24);
      });

      const pages = doc.getNumberOfPages();
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(...grey);
        const h = doc.internal.pageSize.getHeight();
        doc.text(`${o.nombre || ""} · Certificación nº ${c.numero} · ${fecha(c.fecha)}`, M, h - 8);
        doc.text(`Página ${i} de ${pages}`, W - M, h - 8, { align: "right" });
      }
      await guardar(nombreArchivo(c, "pdf"), doc.output("blob"));
    } catch (err) { toast(err.message || "No se pudo generar el PDF."); }
    finally { btn.disabled = false; }
  }

  // ---------- arranque ----------
  const h = (location.hash || "").slice(1); if (["cert", "resumen", "costes", "pres", "obra", "oferta"].includes(h)) S.view = h;
  render();
  (async () => {
    const claude = window.claude;
    const db = claude && claude.use ? await claude.use("db") : null;
    if (!db) { S.offline = true; render(); return; }
    S.db = db;
    try { S.downloads = await claude.use("downloads"); } catch (_) {}
    const onErr = () => { S.offline = true; S.db = null; render(); };
    db.doc("obra/datos").onSnapshot((s) => { S.obra = { ...OBRA_DEF, ...(s.exists ? s.data() : {}) }; S.loaded.obra = true; render(); }, onErr);
    db.doc("obra/presupuesto").onSnapshot((s) => {
      const d = s.exists ? s.data() : null;
      S.pres = d ? JSON.parse(JSON.stringify({ capitulos: d.capitulos || [], partidas: d.partidas || [] })) : { capitulos: [], partidas: [] };
      S.loaded.pres = true; render();
    }, onErr);
    db.doc("costes/resumen").onSnapshot((s) => { S.costes = s.exists ? s.data() : null; if (S.syncPedida && S.costes && S.costes.actualizado !== S.syncDesde) { S.syncPedida = null; toast("Costes actualizados."); } render(); }, () => {});
    db.collection("ofertas").onSnapshot((snap) => {
      S.ofertas = snap.docs.map((d) => ({ ...OF_DEF, id: d.id, ...JSON.parse(JSON.stringify(d.data())) })).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)) || String(a.numero).localeCompare(String(b.numero)));
      if (!S.ofertas.some((x) => x.id === S.ofSel)) S.ofSel = S.ofertas.length ? S.ofertas[S.ofertas.length - 1].id : null;
      S.loaded.ofertas = true; render();
    }, () => { S.loaded.ofertas = true; render(); });
    db.collection("certificaciones").onSnapshot((snap) => {
      S.certs = snap.docs.map((d) => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) })).sort((a, b) => a.numero - b.numero);
      if (!S.certs.some((c) => c.id === S.sel)) S.sel = lastCert() ? lastCert().id : null;
      S.loaded.certs = true; render();
    }, onErr);
  })();
})();
</script>

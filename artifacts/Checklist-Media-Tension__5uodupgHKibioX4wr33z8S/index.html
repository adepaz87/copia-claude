<title>Checklist Media Tensión</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: hoja de inspección de campo; barra de obra fija arriba, apartados plegables, filas concepto | resultado | observaciones */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#16202B; --muted:#5B6775; --line:#D3DAE1;
  --primary:#14324F; --on-primary:#FFFFFF; --signal:#F2B705; --signal-ink:#1A1A1A;
  --ok:#1C7F47; --ok-bg:#E3F3E9; --np:#5F6B78; --np-bg:#E9EDF1; --bad:#BF2A2A; --bad-bg:#FBE5E3;
  --field:#F7F9FB; --focus:#2F6FB0;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#161E25; --surface-2:#1B252D; --ink:#E4EAF0; --muted:#94A2AF; --line:#2A3641;
  --primary:#9CC3E8; --on-primary:#0E1317; --signal:#F2B705; --signal-ink:#1A1A1A;
  --ok:#55C487; --ok-bg:#163326; --np:#A3AEB9; --np-bg:#252F38; --bad:#FF7A6E; --bad-bg:#3A1D1C;
  --field:#11181E; --focus:#7FB2E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#161E25; --surface-2:#1B252D; --ink:#E4EAF0; --muted:#94A2AF; --line:#2A3641;
  --primary:#9CC3E8; --on-primary:#0E1317; --signal:#F2B705; --signal-ink:#1A1A1A;
  --ok:#55C487; --ok-bg:#163326; --np:#A3AEB9; --np-bg:#252F38; --bad:#FF7A6E; --bad-bg:#3A1D1C;
  --field:#11181E; --focus:#7FB2E6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:4px;background:repeating-linear-gradient(-45deg,var(--signal) 0 10px,var(--signal-ink) 10px 20px);opacity:.9}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.obra{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.pick{min-width:0;max-width:300px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
@media (max-width:640px){.top{position:static}.brand small{display:none}.obra{width:100%}select.pick{flex:1 1 100%;max-width:none}}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:90px}
.notice{margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--signal);background:var(--surface);border-radius:6px;font-size:14px}

main{padding-block:18px 60px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card>h2,.sec summary{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;margin:0}
.card>h2{padding:14px 16px 0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* datos de la obra */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px;padding:14px 16px 16px}
.fields .wide{grid-column:span 2}
@media (max-width:520px){.fields .wide{grid-column:auto}}
label.f{display:grid;gap:4px;min-width:0}
label.f span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
textarea.inp{resize:vertical;min-height:38px}

/* resumen */
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 16px}
.meter{flex:1 1 260px;min-width:0}
.meter .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.meter .bar i{display:block;height:100%}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.np{background:var(--np-bg);color:var(--np)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.pend{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* apartados */
.sec{overflow:hidden}
.sec summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 16px;border-bottom:1px solid transparent}
.sec[open] summary{border-bottom-color:var(--line)}
.sec summary::-webkit-details-marker{display:none}
.sec summary .tw{flex:1 1 300px;min-width:0;display:grid;gap:2px}
.sec summary .tw b{font-weight:700}
.sec summary .caret{transition:transform .15s}
.sec[open] summary .caret{transform:rotate(90deg)}
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,280px);gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row[data-r="incor"]{background:linear-gradient(90deg,var(--bad-bg),transparent 60%)}
.row .txt{display:grid;gap:5px;min-width:0}
.row .txt p{margin:0;font-size:14.5px}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ref{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.el{font-size:11.5px;padding:1px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.num{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;align-self:start}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);min-width:58px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="corr"]{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="np"]{background:var(--np-bg);color:var(--np)}
.seg button[aria-pressed="true"][data-v="incor"]{background:var(--bad-bg);color:var(--bad)}
.row textarea{min-height:36px;font-size:13.5px}
.row textarea.concept{font-size:14px;min-height:40px}
.row .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 0;justify-self:start}
.addrow{padding:10px 16px 14px}
@media (max-width:820px){.row{grid-template-columns:minmax(0,1fr)} .seg{justify-self:start}}

/* fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:14px 16px 16px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid}
.ph .img{aspect-ratio:4/3;max-width:100%;background:var(--field);display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{display:grid;gap:6px;padding:8px}
.ph .cap .inp{font-size:13px;padding:6px 8px}
.drop{border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;padding:18px;color:var(--muted);cursor:pointer;min-height:160px;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--primary);color:var(--ink)}
.drop input{display:none}

/* cierre */
.close-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px 18px;padding:14px 16px 16px}
@media (max-width:760px){.close-grid{grid-template-columns:minmax(0,1fr)}}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px}
.radios input{accent-color:var(--primary)}
.hide{display:none!important}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="27" viewBox="0 0 30 27" aria-hidden="true"><path d="M15 1.5 28.5 25.5H1.5Z" fill="var(--signal)" stroke="var(--signal-ink)" stroke-width="2" stroke-linejoin="round"/><path d="M16.2 8.5 11.5 16h3.6l-1.4 6 5-8h-3.6l1.1-5.5Z" fill="var(--signal-ink)"/></svg>

</header>

<div class="wrap">
  <div id="notice" class="notice hide"></div>
  <main id="main">

  </main>
</div>

<script id="sections" type="application/json">[{"id": "ct", "title": "FYZ30000 - PT Centro de Transformación CT Interior Prefabricado", "tipo": "PREF", "items": [{"id": "ct01", "t": "Es el nuevo centro de transformación de maniobra interior.", "ref": "FYZ30000_2 Objeto", "el": "Ubicación y Acceso"}, {"id": "ct02", "t": "Las envolventes prefabricadas y su aparamenta no están manipuladas ni alteradas.", "ref": "", "el": "CT Prefabricado"}, {"id": "ct03", "t": "La ubicación del recinto coincide con la indicada en el proyecto.", "ref": "", "el": "Ubicación y Acceso"}, {"id": "ct04", "t": "El emplazamiento elegido del CT permite el tendido, a partir de él, de todas las canalizaciones subterráneas previstas, de entrada y salida al centro.", "ref": "FYZ30000_6.1 Ubicación y Accesos", "el": "Ubicación y Acceso"}, {"id": "ct05", "t": "Es el acceso al CT directo desde la calle o vial público, garantizándose la entrada de personas y de materiales, y dispone de una adecuada señalización y delimitación ante eventuales trabajos en el mismo.", "ref": "FYZ30000_6.1 Ubicación y Accesos", "el": "Ubicación y Acceso"}, {"id": "ct06", "t": "Permiten las vías de acceso al CT la entrada de materiales y el transporte en camión de los transformadores y demás elementos integrantes del CT, hasta el lugar de ubicación del mismo.", "ref": "FYZ30000_6.1 Ubicación y Accesos", "el": "Ubicación y Acceso"}, {"id": "ct07", "t": "Se ha ubicado el nuevo CT en una zona inundable.", "ref": "FYZ30000_6.1 Ubicación y Accesos", "el": "Ubicación y Acceso"}, {"id": "ct08", "t": "El vial de acceso al centro de transformación se halla en un fondo o badén que eventualmente pudiera resultar inundado por fallo de su sistema de drenaje.", "ref": "FYZ30000_6.1 Ubicación y Accesos", "el": "Ubicación y Acceso"}, {"id": "ct09", "t": "Permiten las dimensiones del CT la instalación de hasta tres celdas de línea y una de protección de trafo, la instalación de un transformador de potencia máxima 1.000 kVA, la instalación de sistemas de telemando, telegestión y medida, la instalación de cuadros de BT de 4/8 salidas, así como la ejecución de las maniobras propias para su explotación en condiciones de seguridad según la ITC-RAT 14.", "ref": "FYZ30000_8.1 Centros Prefabricados de Superficie", "el": "Dimensiones"}, {"id": "ct10", "t": "Permite el nuevo CT la sustitución de cualquiera de los elementos que constituyen el centro de transformación sin necesidad de proceder al desmontaje o desplazamiento del resto.", "ref": "FYZ30000_6.2 Dimensiones", "el": "Dimensiones"}, {"id": "ct11", "t": "Se ha construido una solera de hormigón capaz de soportar los esfuerzos verticales previstos en el CT tal y como se recoge en norma FYZ30000. (8.2 Cimentación de los CT prefabricados)", "ref": "", "el": "CT Prefabricado"}, {"id": "ct12", "t": "Dispone el centro de transformación de acera perimetral de 1 m de ancho por 10 cm de espesor, armada y localizada en la zona utilizada para acceder al mismo, que aporte una elevada resistividad superficial incluso después de haber llovido.", "ref": "FYZ30000_11.7 Medidas adicionales de seguridad para las tensiones de paso y contacto", "el": "Obra Civil"}, {"id": "ct13", "t": "Está el armado de la acera perimetral conectado a la tierra general.", "ref": "FYZ30000_11.7 Medidas adicionales de seguridad para las tensiones de paso y contacto", "el": "Puesta a Tierra General"}, {"id": "ct14", "t": "Abren las puertas de acceso al CT hacia el exterior, disponen de un sistema de retención y pueden abatirse sobre el paramento reduciendo al mínimo sus salientes.", "ref": "FYZ1000_8.1.7 Carpintería y cerrajería", "el": "Elementos Constructivos"}, {"id": "ct15", "t": "Están las puertas de acceso al CT y las rejas de ventilación instaladas de modo que no estén en contacto con el sistema de puesta a tierra general del CT ni con ningún elemento metálico conectado a dicho sistema.", "ref": "", "el": "Elementos Constructivos"}, {"id": "ct16", "t": "Se encuentra el enrejado (mallazo equipotencial) unido a la puesta a tierra general mediante una pletina metálica, de sección mínima igual a la del enrejado, y conductor de Cu 50 mm².", "ref": "FYZ1000_8.1.8 Equipotencialidad, piso y mallazo", "el": "Elementos Constructivos"}, {"id": "ct17", "t": "Son los tubos de entrada de conductores al CT de polietileno de alta densidad, de superficie interna lisa y libres de halógenos, según norma informativa CNL002 Tubos de polietileno.", "ref": "FYZ1000_8.1.9 Tubos de entrada y salida de conductores", "el": "Elementos Constructivos"}, {"id": "ct18", "t": "Se han ubicado como mínimo: 3 tubos para los cables de MT (diámetro 200 mm); 8 tubos para los cables de BT (diámetro 160 mm); 1 tubo para cables de fibra óptica (diámetro 160 mm).", "ref": "FYZ1000_8.1.9 Tubos de entrada y salida de conductores", "el": "Elementos Constructivos"}, {"id": "ct19", "t": "Los tubos no utilizados están sellados convenientemente con espumas impermeables y expandibles.", "ref": "FYZ1000_8.1.9 Tubos de entrada y salida de conductores", "el": "Elementos Constructivos"}, {"id": "ct20", "t": "A efectos de seguridad, se ha previsto tabique separador de salas que impida el contacto accidental con las partes en tensión, según lo indicado en la ITC-RAT 14.", "ref": "", "el": "Elementos Constructivos"}, {"id": "ct21", "t": "Se ha realizado la entrada al CT de las líneas de media tensión mediante cables subterráneos de aluminio unipolares aislados con aislamiento seco termoestable (polietileno reticulado XLPE), de nivel de aislamiento 12/20 o 18/30 kV, y de secciones normalizadas de 150, 240 o 400 mm².", "ref": "FYZ30000_9.1 Líneas de alimentación", "el": "Líneas de Alimentación"}, {"id": "ct22", "t": "Están las celdas de línea motorizadas y disponen de un interruptor-seccionador de corte en carga y un seccionador de puesta a tierra, ambos con dispositivos de señalización de posición.", "ref": "", "el": "Celda"}, {"id": "ct23", "t": "Está la celda del transformador provista de un interruptor-seccionador de corte en carga y dos seccionadores de puesta a tierra con dispositivos de señalización de posición y bases para los fusibles.", "ref": "", "el": "Celda"}, {"id": "ct24", "t": "Son las potencias de los transformadores instalados de 250, 400 o 630 kVA.", "ref": "FYZ30000_7.4 Potencias de transformación", "el": "Transformadores de potencia"}, {"id": "ct25", "t": "Es la intensidad nominal del embarrado y la aparamenta de MT de 630 A, tomando como referencia la norma informativa GSM001 MV RMU with Switch-Disconnector.", "ref": "FYZ30000_7.5 Intensidad nominal en MT", "el": "Celda"}, {"id": "ct26", "t": "Se ha ubicado un transformador de refrigeración en aceite mineral correspondiente a la denominación ONAN según norma UNE-EN 60076-1 y cumple la norma UNE-EN 60076-2.", "ref": "FYZ30000_9.3.1 Transformadores de potencia", "el": "Transformadores de potencia"}, {"id": "ct27", "t": "Se han empleado para la conexión entre el transformador y la celda de protección cables unipolares aislados con aislamiento de polietileno reticulado, de aluminio y sección de 95 mm².", "ref": "FYZ30000_9.4 Cables y terminales de MT para conexión entre transformador y aparamenta", "el": "By-Pass Celda-Trafo"}, {"id": "ct28", "t": "Se ha realizado la unión entre las bornas BT del transformador y el cuadro de BT por medio de cables aislados unipolares de sección 240 mm² Al del tipo XZ1, con aislamiento de polietileno reticulado (XLPE) de 0,6/1 kV y cubierta de poliolefina. La composición del puente se ha ejecutado con el número de conductores recogidos en la norma según la potencia del transformador instalado.", "ref": "FYZ30000_9.5 Puentes de BT", "el": "By-Pass Trafo-CBT"}, {"id": "ct29", "t": "Está el nuevo centro de transformación dotado de un cuadro de distribución de baja tensión de 4 u 8 salidas, con alimentación de grupo.", "ref": "FYZ30000_9.6 Cuadros de BT", "el": "Cuadro BT"}, {"id": "ct30", "t": "Dispone el cuadro de distribución de baja tensión de interruptor de corte en carga.", "ref": "", "el": "Cuadro BT"}, {"id": "ct31", "t": "Para el alumbrado interior del CT se han instalado los puntos de luz necesarios para conseguir, al menos, un nivel medio de iluminación de 150 lux.", "ref": "FYZ30000_9.6 Cuadros de BT", "el": "Alumbrado"}, {"id": "ct32", "t": "Para la protección térmica del transformador, se ha ajustado la sonda a 105 ºC.", "ref": "FYZ30000_10.2 Protección térmica del transformador", "el": "Protección térmica del transformador"}, {"id": "ct33", "t": "Para la protección contra cortocircuito, se han empleado fusibles tipo APR de calibres adecuados a la potencia del transformador instalado.", "ref": "FYZ30000_10.3 Protección contra cortocircuitos", "el": "Protección contra cortocircuitos del transformador"}, {"id": "ct34", "t": "Existe una transición de línea aérea a subterránea para alimentar el CT, lo más corta posible y protegida mediante pararrayos.", "ref": "", "el": "Protección contra sobretensiones"}, {"id": "ct35", "t": "La instalación de puesta a tierra del CT está formada por dos circuitos independientes correspondientes a la tierra general y la de neutro.", "ref": "FYZ30000_11 Instalación de Puesta a Tierra", "el": "Puesta a Tierra General - Neutro"}, {"id": "ct36", "t": "Se han conectado al circuito de puesta a tierra general las masas de MT y BT (envolturas y pantallas metálicas de los cables, envolvente metálica de las celdas de distribución secundaria y cuadros de BT, cuba del transformador en los dos puntos previstos para ello, bornas de tierra de los detectores de tensión, bornas de puesta a tierra de los transformadores de intensidad de BT, pantallas o enrejados de protección, mallazo equipotencial de la solera, tapas y marco metálico de los canales de cables).", "ref": "FYZ30000_11 Instalación de Puesta a Tierra", "el": "Puesta a Tierra General"}, {"id": "ct37", "t": "Para el circuito de puesta a tierra de neutro, se ha conectado el neutro de BT del transformador y la barra general de neutro del cuadro de BT.", "ref": "FYZ30000_11 Instalación de Puesta a Tierra", "el": "Puesta a Tierra Neutro"}, {"id": "ct38", "t": "Se han realizado los nuevos circuitos de puesta a tierra con conductores de cobre desnudo de una sección mínima de 50 mm² o con conductores de aluminio aislado de 95 mm², estando la línea de tierra del neutro aislada en todo su recorrido.", "ref": "FYZ30000_11.4 Líneas de puesta a tierra", "el": "Puesta a Tierra General - Neutro"}, {"id": "ct39", "t": "Es la línea de tierra general, entre la caja de seccionamiento dispuesta en el interior del CT y la primera pica, de cable aislado del tipo XZ1, aislamiento 0,6/1 kV y sección 50 mm² de cobre.", "ref": "FYZ10000_Plano FYZ30101 Red de tierras", "el": "Puesta a Tierra General"}, {"id": "ct40", "t": "La conexión de los elementos conectados a tierra se ha ejecutado mediante derivaciones individuales.", "ref": "FYZ30000_11.5 Ejecución de la puesta a tierra general", "el": "Puesta a Tierra General"}, {"id": "ct41", "t": "Se ha instalado, tanto para la puesta a tierra de protección como para la puesta a tierra de neutro, un borne accesible para la medida de la resistencia de tierra.", "ref": "FYZ30000_11.5 Ejecución de la puesta a tierra", "el": "Puesta a Tierra General - Neutro"}, {"id": "ct42", "t": "Es el valor de la resistencia de la puesta a tierra del neutro inferior a 37 ohmios.", "ref": "FYZ30000_11.6 Ejecución de la puesta a tierra de neutro", "el": "Puesta a Tierra Neutro"}, {"id": "ct43", "t": "Se ha ejecutado la línea de tierra del neutro con cable de cobre aislado 0,6/1 kV del tipo XZ1 de 50 mm² de sección.", "ref": "", "el": "Puesta a Tierra Neutro"}, {"id": "ct44", "t": "Dispone el nuevo CT de un sistema de telemando, equipado con una Unidad Compacta de Telemando (UCT), y dispone de todos los elementos necesarios para poder realizar el telemando y automatización del CT, incluyendo las funciones de terminal remoto, comunicaciones, alimentación segura y aislamiento de baja tensión.", "ref": "FYZ30000_14 Sistema de Telemando", "el": "Telemando"}, {"id": "ct45", "t": "Dispone el sistema de telemando de detector de paso de falta.", "ref": "FYZ30000_14.2 Detector de paso de falta", "el": "Telemando"}, {"id": "ct46", "t": "Para atenuar los campos magnéticos, son las interconexiones lo más cortas posibles y se han evitado paredes y techos colindantes con viviendas.", "ref": "FYZ30000_16.1 Medidas de atenuación de campos magnéticos", "el": "Campos Magnéticos"}, {"id": "ct47", "t": "Se ha utilizado un sistema de ventilación natural para la evacuación del calor generado en el interior del CT.", "ref": "FYZ30000_18 Ventilación", "el": "Ventilación"}, {"id": "ct48", "t": "La posición y tamaño de las rejillas de ventilación están determinadas por la envolvente prefabricada elegida y referenciadas a la norma informativa FNH001 CC.TT. Prefabricados Hormigón Tipo Superficie.", "ref": "FYZ30000_18 Ventilación", "el": "Ventilación"}, {"id": "ct49", "t": "Están los huecos destinados a la ventilación protegidos de forma que impidan el paso de pequeños animales, la introducción de objetos metálicos y la entrada del agua de lluvia.", "ref": "", "el": "Ventilación"}, {"id": "ct50", "t": "Al estar el CT afectado por una alta contaminación salina o ambiental, se han ubicado las rejillas de ventilación en la cara no afectada directamente por vientos dominantes procedentes de la contaminación o, en su defecto, se han instalado cortavientos adecuados.", "ref": "FYZ30000_20 Protección contra la contaminación", "el": "Ventilación - Protección contra la contaminación"}, {"id": "ct51", "t": "Al estar el nuevo centro afectado por una alta contaminación salina o ambiental, se han protegido mediante envolventes aislantes los terminales de los cables de baja tensión, las bornas de BT del transformador y del cuadro de BT.", "ref": "FYZ30000_20 Protección contra la contaminación", "el": "Protección contra la contaminación"}, {"id": "ct52", "t": "Llevan las puertas de acceso al CT el cartel con la correspondiente señal triangular distintiva de riesgo eléctrico.", "ref": "FYZ30000_21 Señalización y material de seguridad", "el": "Señalización y material de seguridad"}, {"id": "ct53", "t": "Llevan las celdas de distribución secundaria y el cuadro de BT la señal triangular distintiva de riesgo eléctrico adhesiva.", "ref": "FYZ30000_21 Señalización y material de seguridad", "el": "Señalización y material de seguridad"}, {"id": "ct54", "t": "Se ha ubicado en un lugar visible del interior del CT un cartel con las instrucciones de primeros auxilios referidas a la respiración boca a boca y masaje cardíaco, y es de un tamaño mínimo UNE A-3.", "ref": "FYZ30000_21 Señalización y material de seguridad", "el": "Señalización y material de seguridad"}, {"id": "ct55", "t": "El recinto está debidamente codificado y rotulado según procedimiento. Es la rotulación de las celdas correcta.", "ref": "", "el": "Codificación y rotulación"}]}, {"id": "gen", "title": "0.- Genéricos Línea MT", "tipo": "Genérico", "items": [{"id": "gen01", "t": "El origen de la nueva línea coincide con el punto de conexión vigente.", "ref": "", "el": ""}, {"id": "gen02", "t": "La nueva red discurre por zonas de dominio público o por dominio privado con las preceptivas autorizaciones (administrativas, licencias, particulares, etc.).", "ref": "", "el": ""}, {"id": "gen03", "t": "El trazado, la naturaleza y sección de los cables corresponde al proyecto facilitado por el cliente.", "ref": "", "el": ""}, {"id": "gen04", "t": "Las extensiones de red se han ejecutado con cables de la misma sección, o sección equivalente, que la de la red existente, según punto de conexión.", "ref": "", "el": ""}, {"id": "gen05", "t": "Se han detectado en una inspección visual defectos generalizados en: apoyos (alineación, golpes, etc.), peanas, conductores, etc.", "ref": "", "el": ""}, {"id": "gen06", "t": "Otros defectos generalizados (robos, vandalismo, etc.).", "ref": "", "el": ""}]}, {"id": "lsmt", "title": "1.- Línea Subterránea de Media Tensión < 30 kV (PT DYZ10000 / EP NRZ001)", "tipo": "LSMT", "items": [{"id": "lsmt01", "t": "Se han instalado los cables bajo tubo directamente enterrado u hormigonado.", "ref": "NRZ001_1 Criterio de Diseño", "el": ""}, {"id": "lsmt02", "t": "En suelos urbanizados, discurre la red por terrenos de dominio público, bajo las aceras o, en caso de saturación de éstas, por la calzada. Su trazado es rectilíneo, paralelo a bordillos o fachadas de los edificios principales, y se han evitado ángulos pronunciados.", "ref": "NRZ001_2.1 Trazado en Suelo Urbanizado", "el": ""}, {"id": "lsmt03", "t": "En suelos rurales, discurre la red por viales o caminos, públicos o privados, asfaltados o de tierra consolidados, disponiendo la canalización en el propio vial o camino. (Si no es posible, se ha instalado paralela al mismo, por la zona de dominio público o en el límite de ésta, siguiendo siempre los límites de propiedad o de división de parcelas).", "ref": "NRZ001_3.2.1 Canalización en suelo rural", "el": ""}, {"id": "lsmt04", "t": "Se han ubicado cables subterráneos unipolares de aluminio, con aislamiento seco termoestable (polietileno reticulado XLPE), con pantalla semiconductora sobre conductor y sobre aislamiento y con pantalla metálica de cobre o aluminio, ajustados a lo indicado en las normas UNE-HD 620-10E, UNE 211620, ITC-LAT-06 y norma informativa DND001.", "ref": "NRZ001_3.1 Conductores", "el": ""}, {"id": "lsmt05", "t": "La sección del conductor empleado es de 150, 240 o 400 mm².", "ref": "NRZ001_3.1 Conductores", "el": ""}, {"id": "lsmt06", "t": "Se han ubicado conductores de 240 o 400 mm² en líneas directas desde la subestación y el centro de reparto.", "ref": "NRZ001_3.1 Conductores", "el": ""}, {"id": "lsmt07", "t": "Se ha previsto, al menos, un tubo de reserva en cada zanja.", "ref": "NRZ001_3.2 Canalizaciones / DYZ10000_8.1 Descripción del trazado", "el": ""}, {"id": "lsmt08", "t": "Los tubos empleados son de polietileno (libres de halógenos) de diámetro exterior 200 mm. Norma UNE EN 50086/94. (TPC doble capa: corrugado exterior / liso interior).", "ref": "NRZ001_3.2 Canalizaciones / DYZ10000_8.1 Descripción del trazado", "el": ""}, {"id": "lsmt09", "t": "Para las canalizaciones en suelo rural, se ha ubicado como mínimo tubo de 160 mm.", "ref": "NRZ001_3.2.1 Canalización en suelo rural LSMT", "el": ""}, {"id": "lsmt10", "t": "El cable en tubo directamente enterrado se ha protegido mecánicamente mediante placa de polietileno normalizada.", "ref": "DYZ10000_2.7 Protección mecánica y señalización", "el": ""}, {"id": "lsmt11", "t": "Para tubos en dado de hormigón, y previamente a la instalación del tubo, se ha cubierto el fondo de la zanja con una lechada de hormigón HNE-15/B/20 de 6 cm de espesor.", "ref": "DYZ10000_2.4 Canalizaciones", "el": ""}, {"id": "lsmt12", "t": "Los tubos han quedado sellados con espumas expandibles impermeables, yeso o mortero ignífugo.", "ref": "NRZ001_3.3 Puntos de acceso / DYZ10000_2.4 Canalizaciones", "el": ""}, {"id": "lsmt13", "t": "Se han ubicado hitos de señalización, con placa de identificación según normativa.", "ref": "DYZ10000 - Plano DYZ10113", "el": ""}, {"id": "lsmt14", "t": "En zanja donde coinciden cables de distintas tensiones, la canalización de MT discurre por debajo de la de BT.", "ref": "DYZ10000_2.4 Canalizaciones", "el": ""}, {"id": "lsmt15", "t": "Se han instalado en la canalización tubos de control para telecomunicaciones, con el fin de facilitar el acceso de operadores de comunicaciones a la red de distribución (un tubo de diámetro mínimo de 63 mm y libre de halógenos).", "ref": "NRZ001_3.2 Canalizaciones LSMT", "el": ""}, {"id": "lsmt16", "t": "Se han ubicado los tubos de comunicaciones por encima de los tubos eléctricos, teniendo la canalización continuidad en todo su recorrido.", "ref": "DYZ10000_8.1 Descripción del Trazado", "el": ""}, {"id": "lsmt17", "t": "Se han ubicado protecciones mecánicas suficientes, tales como una plancha de acero (de al menos 3 mm de espesor), previo acuerdo con e-distribución, en la canalización subterránea que no cumple la profundidad reglamentaria.", "ref": "NRZ001_3.2 Canalizaciones LSMT", "el": ""}, {"id": "lsmt18", "t": "Se han enterrado las líneas bajo tubo de 200 mm de diámetro exterior, a una profundidad mínima de 70 cm en aceras y tierra y 90 cm en calzadas, medidos desde la parte superior del tubo al pavimento.", "ref": "DYZ10000_8.1 Descripción del trazado", "el": ""}, {"id": "lsmt19", "t": "En los cruces de calzada y accesos a garajes, así como en cualquier suelo con tráfico rodado o donde se prevea la circulación (incluido el trabajo de vehículos agrícolas en suelo rural), los cables se han instalado en canalizaciones entubadas hormigonadas.", "ref": "NRZ001_3.2 Canalizaciones LSMT", "el": ""}, {"id": "lsmt20", "t": "Las pantallas metálicas de los cables se han conectado a tierra en cada uno de sus extremos.", "ref": "DYZ10000_11 Puesta a tierra", "el": ""}, {"id": "lsmt21", "t": "Por zonas de tráfico rodado, en las canalizaciones no se han realizado arquetas con tapas practicables.", "ref": "NRZ001_3.3 Puntos de acceso", "el": ""}, {"id": "lsmt22", "t": "Para garantizar la localización de las arquetas ciegas o registrables, se han colocado clavos de señalización topográfica empotrados, con grabado en relieve: (e-distribución) + (símbolo de un rayo) + (MT). El material empleado es: clavo (latón), arandela (latón Cu Zn 33), taco (poliamida). Norma de referencia 851003.", "ref": "NRZ001_3.3 Puntos de acceso", "el": ""}, {"id": "lsmt23", "t": "Se ha realizado ensayo de resistencia a la extracción del clavo de señalización.", "ref": "", "el": ""}, {"id": "lsmt24", "t": "Se han ubicado, previo acuerdo con e-distribución, arquetas vistas con tapas practicables.", "ref": "NRZ001_3.3 Puntos de acceso", "el": ""}, {"id": "lsmt25", "t": "Los empalmes se han realizado en tramos rectos, ejecutándose en calas o arquetas.", "ref": "NRZ001_3.4.1 Empalmes", "el": ""}, {"id": "lsmt26", "t": "En los empalmes se han ubicado placas de protección antideflagración como medida de protección ante el fallo de uno de ellos con respecto a los empalmes del resto de fases o de los propios cables.", "ref": "NRZ001_3.4.1 Empalmes", "el": ""}, {"id": "lsmt27", "t": "En galerías visitables el ancho libre mínimo es de 0,90 m y la altura de 2 m. La construcción es de hormigón armado y dispone de suelo en pendiente con sistema de drenaje. No es compartida con canalización de gas o líquidos inflamables. Si la longitud excede de 400 m, dispone de sistema fijo de iluminación, alumbrado de señalización y detectores de gas.", "ref": "ITC-LAT-06", "el": ""}, {"id": "lsmt28", "t": "En galerías visitables los cables están soportados mediante bandejas y, si éstas son metálicas, están conectadas rígidamente a tierra.", "ref": "ITC-LAT-06", "el": ""}, {"id": "lsmt29", "t": "Se ha realizado el ensayo previo de los cables según ITC-LAT-05.", "ref": "", "el": ""}, {"id": "lsmt30", "t": "Cumple con las condiciones de cruzamiento, proximidad y paralelismo previstas en la ITC-LAT-06.", "ref": "DYZ10000_9 Cruzamientos, proximidades y paralelismos", "el": ""}, {"id": "lsmt31", "t": "En cruces de calle y carretera, los tubos se han instalado perpendicularmente a la vía, a una profundidad mayor o igual a 60 cm (o la dispuesta por el organismo público correspondiente) y se han recubierto de hormigón en toda su longitud.", "ref": "DYZ10000_9 Cruzamientos, proximidades y paralelismos", "el": ""}, {"id": "lsmt32", "t": "Los acabados de obra civil son correctos y conformes a la normativa municipal e indicaciones de la licencia de obra (pavimento en aceras, asfaltado en calles, protección mecánica, señalización, etc.).", "ref": "", "el": ""}]}]</script>
<script>
(function(){
const SECTIONS = JSON.parse(document.getElementById('sections').textContent);
const HEADER = [
  ['exp','Nº expediente (EXP.)'],['titular','Titular'],['supervisor','Supervisor'],['fecha','Fecha','date'],
  ['direccion','Dirección','text','wide'],['solicitante','Solicitante'],['representante','Representante'],
  ['municipio','Municipio'],['isla','Isla'],['cd','CD nº'],['lbt','Nº LBT']
];
const RES = [['corr','Corr'],['np','N/p'],['incor','Incor']];
const RES_LABEL = {corr:'Correcto',np:'No procede',incor:'Incorrecto','':''};
const $ = (s,el=document)=>el.querySelector(s);
const el = (tag, attrs={}, ...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids)if(k!=null)e.append(k);return e};
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let db=null, assets=null, downloads=null, mode='loading';
let list=[];            // [{id,data}]
let curId=null, cur=null;
let filter='all';
let dirty=false, saving=false, saveTimer=null, needRender=false;

function blank(){return {h:{},r:{},extra:{},fotos:[],cierre:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function titleOf(d){const h=d.h||{};const t=[h.exp&&('EXP '+h.exp),h.municipio||h.direccion].filter(Boolean).join(' · ');return t||'Obra sin datos'}
function setStatus(t){$('#status').textContent=t}
function notice(t){const n=$('#notice');n.textContent=t||'';n.classList.toggle('hide',!t)}

/* ---------- almacenamiento ---------- */
const LS='checklist-mt-v1';
function lsAll(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}}
function lsPut(id,d){try{const a=lsAll();if(d)a[id]=d;else delete a[id];localStorage.setItem(LS,JSON.stringify(a))}catch(e){}}

async function persist(){
  if(!cur||!curId)return;
  if(saving){scheduleSave(400);return}
  saving=true;dirty=false;setStatus('Guardando…');
  cur.updatedAt=new Date().toISOString();
  const snap=JSON.parse(JSON.stringify(cur));
  try{
    if(mode==='db') await db.collection('inspecciones').doc(curId).set(snap);
    else lsPut(curId,snap);
    setStatus('Guardado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    dirty=true;
    if(e&&e.code==='quota_exceeded')setStatus('Sin espacio');
    else if(e&&e.code==='invalid_argument'){setStatus('Sin permiso');notice('No tienes permiso para guardar cambios en esta checklist. Pide acceso de edición a su propietario.')}
    else{setStatus('Error al guardar');scheduleSave(3000)}
  }finally{saving=false;if(dirty&&!saveTimer)scheduleSave(600);if(needRender&&!editing())applyRemote()}
}
function scheduleSave(ms=700){dirty=true;setStatus('Cambios sin guardar');clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;persist()},ms)}
function editing(){const a=document.activeElement;return a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}

function onList(items){
  list=items.sort((a,b)=>(b.data.updatedAt||'').localeCompare(a.data.updatedAt||''));
  if(!curId||!list.find(x=>x.id===curId)){
    if(dirty&&curId)return;
    const first=list[0];curId=first?first.id:null;cur=first?JSON.parse(JSON.stringify(first.data)):null;renderAll();
  }else{
    const remote=list.find(x=>x.id===curId).data;
    if(!dirty&&!saving&&JSON.stringify(remote)!==JSON.stringify(cur)){
      needRender=true; if(!editing())applyRemote();
    }
    renderPicker();
  }
}
function applyRemote(){const r=list.find(x=>x.id===curId);if(!r)return;needRender=false;cur=JSON.parse(JSON.stringify(r.data));renderAll()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(needRender&&!editing()&&!dirty)applyRemote()},50));

async function createObra(base){
  if(dirty){clearTimeout(saveTimer);saveTimer=null;await persist()}
  const id=uid();const d=blank();
  if(base){d.h=Object.assign({},base.h);d.h.fecha='';}
  curId=id;cur=d;
  list.unshift({id,data:d});
  renderAll();
  await persist();
  const f=$('#h_exp');if(f)f.focus();
}

/* ---------- render ---------- */
function renderPicker(){
  const p=$('#pick');p.textContent='';
  if(!list.length){p.append(el('option',{text:'Sin obras'}));p.disabled=true}
  else{p.disabled=false;for(const it of list){const d=it.id===curId?cur:it.data;p.append(el('option',{value:it.id,text:titleOf(d)+(d.example?' (ejemplo)':''),selected:it.id===curId}))}}
  for(const b of ['#duplicar','#csv','#borrar','#guardar','#pdf'])$(b).disabled=!cur;
  $('#csv').classList.toggle('hide',!downloads);$('#pdf').classList.toggle('hide',!downloads);
}
function counts(){
  let n=0,c={corr:0,np:0,incor:0};
  for(const s of SECTIONS){for(const it of s.items){n++;const r=(cur.r[it.id]||{}).r;if(c[r]!=null)c[r]++}
    for(const x of (cur.extra[s.id]||[])){n++;if(c[x.r]!=null)c[x.r]++}}
  return {n,...c,pend:n-c.corr-c.np-c.incor};
}
function secCounts(s){let n=0,d=0,bad=0;const f=r=>{n++;if(r)d++;if(r==='incor')bad++};for(const it of s.items)f((cur.r[it.id]||{}).r);for(const x of(cur.extra[s.id]||[]))f(x.r);return{n,d,bad}}

function renderSummary(){
  const c=counts(),box=$('#summary');if(!box)return;

  box.querySelector('.bar').append(el('i',{style:`width:${pct(c.corr)};background:var(--ok)`}),el('i',{style:`width:${pct(c.np)};background:var(--np)`}),el('i',{style:`width:${pct(c.incor)};background:var(--bad)`}));

  box.querySelector('.lbl').append(el('span',{text:`${c.n-c.pend} de ${c.n} conceptos revisados`}),el('span',{text:Math.round(100*(c.n-c.pend)/c.n)+' %'}));

function applyFilter(){

    b.addEventListener('click',()=>{const nv=get()===v?'':v;set(nv);s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===nv)));s.closest('.row').dataset.r=nv;renderSummary();applyFilter();scheduleSave(300)});s.append(b)}

function rowFor(s,it,idx){
  const st=()=>cur.r[it.id]||(cur.r[it.id]={});

  const meta=el('div',{class:'meta'},el('span',{class:'num',text:it.id.toUpperCase()}),it.ref?el('span',{class:'ref',text:it.ref}):null,it.el?el('span',{class:'el',text:it.el}):null);

    g.append(el('figure',{class:'ph',style:'margin:0'},img,el('figcaption',{class:'cap'},d,c,del)));

    g.append(drop);

    g.append(el('div',{class:'drop',style:'cursor:default'},el('div',{text:'Las fotografías solo se pueden añadir con permiso de edición en esta checklist.'})));
  }

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const max=1800,s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(s===1&&file.size<1.5e6)return file;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.85));
  }catch(e){return file}
}
async function addFiles(files){
  const target=cur;
  for(const f of files){
    const p={id:uid(),asset:'',desc:'',coord:''};target.fotos=target.fotos||[];target.fotos.push(p);if(target===cur)renderPhotos();
    try{const blob=await shrink(f);const res=await assets.upload(blob,{contentType:blob.type||'image/jpeg'});p.asset=res.id;}
    catch(e){target.fotos=target.fotos.filter(x=>x!==p);notice(e&&e.code==='quota_exceeded'?'No queda espacio para más fotografías en esta checklist. Quita alguna que ya no necesites.':'No se pudo subir «'+f.name+'». Prueba con una imagen JPG o PNG.')}
    if(target===cur){renderPhotos();scheduleSave(200)}
  }
}

    const n=d.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(7.5);d.setTextColor(...GREY);d.text(`Página ${i} de ${n}`,W-M,H-14,{align:'right'});d.text('Generado el '+new Date().toLocaleDateString('es-ES'),M,H-14)}
    const name='Informe_Checklist_MT_'+((h.exp||'obra').replace(/[^\w-]+/g,'_'))+'.pdf';
    const r=await downloads.save({filename:name,data:d.output('blob')});
    if(r&&r.status==='saved')setStatus('PDF exportado');
  }catch(e){
    if(e&&e.code==='unavailable')$('#pdf').classList.add('hide');
    else if(e&&e.message==='lib')notice('No se pudo cargar el generador de PDF. Comprueba la conexión y vuelve a intentarlo.');
    else if(!(e&&e.code))notice('No se pudo generar el informe PDF.');
    if(e&&!e.code)console.error(e);
  }finally{btn.disabled=false;btn.textContent=old}
}

/* ---------- eventos barra ---------- */
$('#pick').addEventListener('change',async e=>{if(dirty){clearTimeout(saveTimer);saveTimer=null;await persist()}curId=e.target.value;const it=list.find(x=>x.id===curId);cur=JSON.parse(JSON.stringify(it.data));filter='all';renderAll();window.scrollTo({top:0})});
$('#nueva').addEventListener('click',()=>createObra());
$('#duplicar').addEventListener('click',()=>{if(cur)createObra(cur)});
$('#csv').addEventListener('click',exportCsv);
$('#pdf').addEventListener('click',exportPdf);
$('#guardar').addEventListener('click',async()=>{if(!cur)return;clearTimeout(saveTimer);saveTimer=null;await persist()});
const bb=$('#borrar');
bb.addEventListener('click',async()=>{
  if(!cur)return;
  if(!bb.dataset.armed){bb.dataset.armed='1';bb.textContent='¿Eliminar esta obra?';setTimeout(()=>{delete bb.dataset.armed;bb.textContent='Eliminar'},4000);return}
  delete bb.dataset.armed;bb.textContent='Eliminar';
  const id=curId;clearTimeout(saveTimer);saveTimer=null;dirty=false;
  try{if(mode==='db')await db.collection('inspecciones').doc(id).delete();else lsPut(id,null)}catch(e){setStatus('No se pudo eliminar');return}
  list=list.filter(x=>x.id!==id);curId=list[0]?list[0].id:null;cur=list[0]?JSON.parse(JSON.stringify(list[0].data)):null;renderAll();setStatus('Obra eliminada');
});

/* ---------- arranque ---------- */
(async function start(){
  const cl=window.claude;
  if(cl&&cl.use){
    [db,assets,downloads]=await Promise.all([cl.use('db').catch(()=>null),cl.use('assets').catch(()=>null),cl.use('downloads').catch(()=>null)]);
  }
  if(db){
    mode='db';
    db.collection('inspecciones').onSnapshot(snap=>{onList(snap.docs.map(d=>({id:d.id,data:d.data()})))},err=>{notice('Se ha perdido la conexión con el almacenamiento. Recarga la página para seguir guardando.')});
  }else{
    mode='local';
    notice('Esta vista no puede guardar en la nube: los cambios se guardan solo en este navegador.');
    const a=lsAll();onList(Object.entries(a).map(([id,data])=>({id,data})));
  }
})();
})();
</script>

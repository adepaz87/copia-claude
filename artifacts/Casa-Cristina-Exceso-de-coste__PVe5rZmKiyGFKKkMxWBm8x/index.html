<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Casa Cristina · Exceso de coste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hoja de medición — cabecera con total, lista de partidas editables, resumen fijo abajo */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#dde1e7;
  --accent:#1f4fd1; --accent-soft:#e7edfc; --input:#f8f9fb;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --fg:#e7ebf0; --muted:#97a3b2; --line:#2a3542;
  --accent:#7ea2ff; --accent-soft:#1d2a45; --input:#1e2732; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --fg:#e7ebf0; --muted:#97a3b2; --line:#2a3542;
  --accent:#7ea2ff; --accent-soft:#1d2a45; --input:#1e2732; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 140px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:22px;font-weight:600;margin:2px 0 0;text-wrap:balance}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) 92px 50px 92px 100px 28px;gap:10px;align-items:start;
  padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.head{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-block:10px}
.num{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:7px}
textarea{width:100%;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid transparent;
  border-radius:6px;padding:6px;resize:none;field-sizing:content;min-height:2.6em}
textarea:hover{border-color:var(--line)}
input{width:100%;font-family:var(--mono);font-size:14px;color:var(--fg);background:var(--input);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
input.ud{text-align:center;font-family:var(--sans)}
.price input{border-color:var(--accent);background:var(--accent-soft)}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-top:7px;font-weight:500}
.del{border:0;background:none;color:var(--muted);padding:6px 4px;font-size:16px}
.del:hover{color:var(--fg)}
.lbl{display:none;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.add{margin-top:10px}
.params{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}
.params label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.params input{width:110px}
.summary{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.summary .in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.s{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.s b{font-family:var(--mono);font-size:15px;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.s.total{margin-left:auto}
.s.total b{font-size:22px;color:var(--accent);font-weight:600}
.toast{font-size:13px;color:var(--accent)}
@media (max-width:640px){
  .head{display:none}
  .row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .num{grid-column:1/3;padding-top:0}
  .del{grid-column:3;grid-row:1;justify-self:end;padding:0}
  .desc{grid-column:1/-1}
  .lbl{display:block}
  .amt-cell{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:6px}
  .amt-cell .lbl{margin:0}
  .amt{padding-top:0}
  .s.total{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Relación valorada · Instalación eléctrica en Pladur</div>
      <h1>Casa Cristina — exceso de coste</h1>
    </div>
    <div class="tools">
      <button id="pdf" class="primary" type="button" hidden>Exportar PDF</button>
      <button id="copy" type="button">Copiar tabla</button>
      <button id="reset" type="button">Restablecer</button>
    </div>
  </header>

  <div class="list" id="list"></div>
  <button class="add" id="add" type="button">+ Añadir partida</button>

  <div class="params">
    <label for="gg">GG + BI (%)<input id="gg" type="number" step="0.5" inputmode="decimal"></label>
    <label for="igic">IGIC (%)<input id="igic" type="number" step="0.5" inputmode="decimal"></label>
  </div>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
</div>

<div class="summary"><div class="in">
  <div class="s">Ejecución material<b id="pem">0,00 €</b></div>
  <div class="s"><span id="ggl">GG + BI</span><b id="ggv">0,00 €</b></div>
  <div class="s">Base imponible<b id="base">0,00 €</b></div>
  <div class="s"><span id="igl">IGIC</span><b id="igv">0,00 €</b></div>
  <div class="s total">Total exceso de coste<b id="tot">0,00 €</b></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const DEFAULT = {gg:35, igic:7, items:[
 {d:"Punto de luz para tira LED de espejo de vestidor, con interruptor de encendido. Instalación empotrada en Pladur, incluso p.p. de tubo y cable (9 m)",q:2,u:"ud",p:62.00},
 {d:"Punto de luz para tira LED de jabonero, con interruptor de encendido. Instalación empotrada en Pladur, incluso p.p. de tubo y cable (7 m)",q:2,u:"ud",p:54.00},
 {d:"Punto de luz para tira LED de TV, incluso p.p. de interruptor de encendido común. Instalación empotrada en Pladur, incluso p.p. de tubo y cable (6 m)",q:3,u:"ud",p:38.00},
 {d:"Punto de alimentación para toallero eléctrico con caja de salida de cables. Instalación empotrada en Pladur, incluso p.p. de tubo y cable 3×2,5 mm² (4 m)",q:2,u:"ud",p:34.00},
 {d:"Punto de alimentación para persiana eléctrica. Instalación empotrada en Pladur, incluso p.p. de tubo y cable 4×1,5 mm² (9 m)",q:4,u:"ud",p:52.00},
 {d:"Punto de luz sencillo. Instalación empotrada en Pladur, incluso p.p. de tubo y cable (2 m). Hab. 1 (6), Hab. 2 (7), Hab. 3 (2), salón (6), isla (2), cocina (2), vestidor 1 (1), vestidor 2 (1)",q:27,u:"ud",p:16.00}
]};
const KEY="casa-cristina-precios-v2";
let st;
try{ st=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
if(!st||!Array.isArray(st.items)) st=structuredClone(DEFAULT);

const eur=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true})+" €";
const r2=n=>Math.round(n*100)/100;
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:0};
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

function render(){
  const L=$("list");
  L.innerHTML=`<div class="row head"><span>Nº</span><span>Descripción</span><span style="text-align:right">Medición</span><span style="text-align:center">Ud</span><span style="text-align:right">Precio €</span><span style="text-align:right">Importe</span><span></span></div>`;
  st.items.forEach((it,i)=>{
    const row=document.createElement("div");row.className="row";
    row.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span>
      <div class="desc"><textarea id="d${i}" rows="2" aria-label="Descripción partida ${i+1}"></textarea></div>
      <div><span class="lbl">Medición</span><input id="q${i}" type="number" step="any" inputmode="decimal"></div>
      <div><span class="lbl">Ud</span><input id="u${i}" class="ud" type="text"></div>
      <div class="price"><span class="lbl">Precio €</span><input id="p${i}" type="number" step="0.01" inputmode="decimal"></div>
      <div class="amt-cell"><span class="lbl">Importe</span><div class="amt" id="a${i}"></div></div>
      <button class="del" type="button" aria-label="Eliminar partida ${i+1}" data-i="${i}">×</button>`;
    L.appendChild(row);
    row.querySelector("textarea").value=it.d;
    row.querySelector(`#q${i}`).value=it.q;
    row.querySelector(`#u${i}`).value=it.u;
    row.querySelector(`#p${i}`).value=it.p.toFixed(2);
    row.querySelector(`#d${i}`).oninput=e=>{it.d=e.target.value;save()};
    row.querySelector(`#q${i}`).oninput=e=>{it.q=num(e.target.value);calc()};
    row.querySelector(`#u${i}`).oninput=e=>{it.u=e.target.value;save()};
    row.querySelector(`#p${i}`).oninput=e=>{it.p=num(e.target.value);calc()};
    row.querySelector(".del").onclick=()=>{st.items.splice(i,1);render()};
  });
  $("gg").value=st.gg;$("igic").value=st.igic;
  calc();
}
function totals(){
  const pem=r2(st.items.reduce((s,it,i)=>s+r2(it.q*it.p),0));
  const gg=r2(pem*st.gg/100), base=r2(pem+gg), ig=r2(base*st.igic/100);
  return {pem,gg,base,ig,tot:r2(base+ig)};
}
function calc(){
  st.items.forEach((it,i)=>{const a=$("a"+i);if(a)a.textContent=eur(r2(it.q*it.p))});
  const t=totals();
  $("pem").textContent=eur(t.pem);$("ggv").textContent=eur(t.gg);$("base").textContent=eur(t.base);
  $("igv").textContent=eur(t.ig);$("tot").textContent=eur(t.tot);
  $("ggl").textContent=`GG + BI (${String(st.gg).replace(".",",")} %)`;
  $("igl").textContent=`IGIC (${String(st.igic).replace(".",",")} %)`;
  save();
}
$("gg").oninput=e=>{st.gg=num(e.target.value);calc()};
$("igic").oninput=e=>{st.igic=num(e.target.value);calc()};
$("add").onclick=()=>{st.items.push({d:"Nueva partida",q:1,u:"ud",p:0});render();$("d"+(st.items.length-1)).focus()};
$("reset").onclick=e=>{
  const b=e.currentTarget;
  if(b.dataset.ok){st=structuredClone(DEFAULT);render();b.textContent="Restablecer";delete b.dataset.ok;msg("Precios originales restablecidos");return}
  b.dataset.ok="1";b.textContent="¿Seguro? Pulsa otra vez";
  setTimeout(()=>{if(b.dataset.ok){delete b.dataset.ok;b.textContent="Restablecer"}},3500);
};
function msg(t){$("toast").textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$("toast").textContent="",2500)}
$("copy").onclick=()=>{
  const f=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
  const lines=["Nº\tDescripción\tMedición\tUd\tPrecio (€)\tImporte (€)"];
  st.items.forEach((it,i)=>lines.push([i+1,it.d,f(it.q),it.u,f(it.p),f(r2(it.q*it.p))].join("\t")));
  const t=totals();
  lines.push("","\tEjecución material\t\t\t\t"+f(t.pem),`\tGG + BI (${st.gg} %)\t\t\t\t`+f(t.gg),"\tBase imponible\t\t\t\t"+f(t.base),`\tIGIC (${st.igic} %)\t\t\t\t`+f(t.ig),"\tTotal exceso de coste\t\t\t\t"+f(t.tot));
  const txt=lines.join("\n");
  navigator.clipboard.writeText(txt).then(()=>msg("Tabla copiada: pégala en Excel o en el documento")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");msg("Tabla copiada")}catch(e){msg("No se pudo copiar; selecciona y copia a mano")}
    ta.remove();
  });
};
render();

function buildPdf(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const f=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
  const W=doc.internal.pageSize.getWidth();
  doc.setFont("helvetica","bold");doc.setFontSize(15);
  doc.text("Casa Cristina",14,18);
  doc.setFontSize(11);doc.setFont("helvetica","normal");
  doc.text("Relación valorada de exceso de coste · Instalación eléctrica",14,25);
  doc.setFontSize(9);doc.setTextColor(90);
  doc.text(new Date().toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}),W-14,18,{align:"right"});
  doc.setTextColor(0);
  doc.autoTable({
    startY:32,
    head:[["Nº","Descripción","Medición","Ud","Precio (€)","Importe (€)"]],
    body:st.items.map((it,i)=>[i+1,it.d,f(it.q),it.u,f(it.p),f(r2(it.q*it.p))]),
    styles:{font:"helvetica",fontSize:8.5,cellPadding:2,valign:"top"},
    headStyles:{fillColor:[31,79,209],textColor:255,fontStyle:"bold"},
    columnStyles:{0:{cellWidth:10,halign:"center"},1:{cellWidth:"auto"},2:{cellWidth:20,halign:"right"},3:{cellWidth:12,halign:"center"},4:{cellWidth:22,halign:"right"},5:{cellWidth:24,halign:"right"}},
    margin:{left:14,right:14}
  });
  const t=totals();
  const p=v=>String(v).replace(".",",");
  doc.autoTable({
    startY:doc.lastAutoTable.finalY+6,
    body:[["Ejecución material",f(t.pem)],[`Gastos generales y beneficio industrial (${p(st.gg)} %)`,f(t.gg)],["Base imponible",f(t.base)],[`IGIC (${p(st.igic)} %)`,f(t.ig)],["TOTAL EXCESO DE COSTE (€)",f(t.tot)]],
    styles:{font:"helvetica",fontSize:9.5,cellPadding:2},
    columnStyles:{0:{halign:"right"},1:{cellWidth:30,halign:"right"}},
    didParseCell:d=>{if(d.row.index===4){d.cell.styles.fontStyle="bold";d.cell.styles.fillColor=[231,237,252]}},
    theme:"plain",tableWidth:120,margin:{left:W-14-120}
  });
  doc.setFontSize(8);doc.setTextColor(90);
  doc.text("Instalación empotrada en Pladur. Los precios incluyen la parte proporcional de tubo y cable.",14,doc.lastAutoTable.finalY+10);
  return doc.output("blob");
}
(async()=>{
  const dl=await window.claude?.use?.("downloads");
  if(!dl||!window.jspdf) return;
  const b=$("pdf");b.hidden=false;
  b.onclick=async()=>{
    try{await dl.save({filename:"Casa Cristina - Relacion valorada.pdf",data:buildPdf()});msg("PDF guardado")}
    catch(e){
      if(e?.code==="declined") return;
      if(e?.code==="rate_limited"){msg("Ya hay una descarga pendiente; espera un momento");return}
      msg("No se pudo exportar el PDF en esta vista");
    }
  };
})();
</script>

</body></html>
